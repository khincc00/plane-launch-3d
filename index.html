<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060b18">
<title>Plane Launch 3D</title>
<meta name="description" content="Game ketapel pesawat 3D berbasis web dengan fisika terbang realistis. Tanpa iklan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060b18; --panel:rgba(8,16,34,.94); --line:rgba(125,211,252,.2);
  --text:#f2f7ff; --muted:#a7b8d4; --sky:#38bdf8; --yellow:#facc15; --green:#4ade80; --red:#fb7185;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
button{touch-action:manipulation}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#c:active{cursor:grabbing}
.mono{font-family:'JetBrains Mono',monospace}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:disabled{opacity:.45;cursor:not-allowed}

#hud{position:fixed;left:0;right:0;top:0;padding:12px 16px;pointer-events:none;display:none}
.hud-row{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:rgba(6,11,24,.62);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:7px 12px;min-width:86px}
.stat span{display:block;font-size:10px;letter-spacing:.16em;color:var(--muted)}
.stat b{font-family:'Sora',sans-serif;font-size:18px;font-weight:800}
.stat.big b{font-size:24px;color:var(--yellow)}
.stat.coin b{color:var(--yellow)}
.hud-sub{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.chip{background:rgba(6,11,24,.6);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.prog{margin-top:8px;max-width:420px;background:rgba(6,11,24,.6);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:11px;letter-spacing:.08em}
.prog i{display:block;margin-top:4px;height:7px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--green));border-radius:9px}
.bars{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-width:240px}
.bar{font-size:10px;letter-spacing:.14em;color:var(--muted)}
.bar i{display:block;margin-top:3px;height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i u{display:block;height:100%;width:100%;border-radius:9px}

#topBtns{position:fixed;top:12px;right:16px;display:none;gap:8px;z-index:5;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.round{background:rgba(6,11,24,.7);border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:13px;font-weight:700;backdrop-filter:blur(8px)}

#aimInfo{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);display:none;gap:10px;pointer-events:none}
#aimInfo .stat{text-align:center}
#hint{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);text-align:center;background:rgba(6,11,24,.72);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:13px;pointer-events:none;display:none;transition:opacity .4s}
#flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(255,80,60,0) 40%,rgba(255,60,40,.55));opacity:0;transition:opacity .5s}

.pad{position:fixed;bottom:24px;display:none;gap:10px;z-index:4;align-items:flex-end}
#padL{left:16px}#padR{right:16px}
.pad .col{display:flex;flex-direction:column;gap:10px}
.pad button{width:64px;height:64px;border-radius:20px;background:rgba(6,11,24,.7);border:1px solid var(--line);font-size:22px;font-weight:800;backdrop-filter:blur(8px);touch-action:none;user-select:none;-webkit-user-select:none}
.pad button.on{background:var(--yellow);color:#111}
#bRocket{width:78px;height:78px;font-size:30px}

.overlay{position:fixed;z-index:10;display:none}
#garage{right:0;top:0;bottom:0;width:min(480px,100%);background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:20px 18px 110px;backdrop-filter:blur(14px)}
#garage .head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;gap:10px;align-items:center}
.logo .ic{width:40px;height:40px;border-radius:12px;background:var(--yellow);color:#111;display:grid;place-items:center;font-size:20px}
.logo b{display:block;font-family:'Sora';font-size:17px;letter-spacing:-.01em}
.logo span{font-size:10px;letter-spacing:.18em;color:var(--sky)}
.wallet{background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.35);color:var(--yellow);border-radius:999px;padding:8px 13px;font-family:'Sora';font-weight:800;white-space:nowrap}
.sec{margin-top:20px}
.kick{font-size:11px;letter-spacing:.2em;color:var(--yellow);font-weight:700;display:flex;align-items:center;gap:8px}
.kick:before{content:"";width:22px;height:1px;background:var(--yellow)}
.lvcard{margin-top:12px;border:1px solid rgba(250,204,21,.45);border-radius:20px;padding:15px;background:linear-gradient(145deg,rgba(250,204,21,.12),rgba(56,189,248,.06))}
.lvcard .top{display:flex;gap:12px;align-items:center}
.lvcard .em{font-size:44px;line-height:1}
.lvcard small{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--sky)}
.lvcard h3{margin:2px 0 0;font-family:'Sora';font-size:19px;line-height:1.15}
.lvcard p{margin:4px 0 0;font-size:12.5px;color:#cbd8ee}
.road{display:flex;gap:5px;margin-top:12px}
.road span{flex:1;text-align:center;border-radius:10px;padding:6px 0;font-size:18px;background:rgba(255,255,255,.05);border:1px solid transparent}
.road span.done{background:rgba(74,222,128,.15);border-color:rgba(74,222,128,.4)}
.road span.cur{background:rgba(250,204,21,.18);border-color:var(--yellow)}
.road span.lock{opacity:.35}
.pico{height:1.3em;width:auto;vertical-align:middle}
.road .pico{height:24px}
.em .pico{height:44px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:11.5px}
.chips span{border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:#cbd8ee}
.btn{border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;background:#fff;color:#111}
.btn.y{background:var(--yellow)}
.tag{display:inline-block;text-align:center;border-radius:999px;padding:7px 10px;font-size:11.5px;font-weight:800}
.tag.on{background:var(--yellow);color:#111}
.ups{display:grid;gap:10px;margin-top:12px}
.up{border:1px solid var(--line);border-radius:18px;padding:13px;background:rgba(255,255,255,.035)}
.up.keep{border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.06)}
.up .t{display:flex;align-items:center;justify-content:space-between;gap:10px}
.up h4{margin:0;font-family:'Sora';font-size:15px}
.up p{margin:6px 0 4px;font-size:12px;color:var(--muted);line-height:1.45}
.up .nx{margin:0 0 9px;font-size:12px;color:#fde68a}
.lv{display:flex;gap:3px}
.lv i{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.1)}
.lv i.f{background:var(--yellow)}
.lvt{font-size:10.5px;color:var(--muted);margin-top:5px;letter-spacing:.08em}
.note{margin-top:10px;font-size:12px;color:#fde68a;line-height:1.5}
.statsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sg{border-radius:14px;background:rgba(255,255,255,.04);padding:9px 11px}
.sg span{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted)}
.sg b{font-family:'JetBrains Mono';font-size:14px}
.phys{margin-top:12px;font-size:12.5px;line-height:1.55;color:#cbd8ee;border-radius:16px;border:1px solid var(--line);padding:12px 14px;background:rgba(56,189,248,.06)}
.phys b{color:#fff}
.warn{margin-top:8px;font-size:12px;color:#fca5a5;line-height:1.5}
.noads{margin-top:14px;font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.noads span{border:1px solid rgba(251,113,133,.35);color:#fecdd3;border-radius:999px;padding:4px 9px}
.go{position:fixed;right:18px;bottom:18px;width:min(444px,calc(100% - 36px));padding:16px;border-radius:18px;background:var(--yellow);color:#111;font-family:'Sora';font-weight:800;font-size:17px;z-index:11;display:none;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.reset{margin-top:18px;background:none;color:var(--muted);font-size:12px;text-decoration:underline}

#result{left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,calc(100% - 32px));max-height:calc(100% - 32px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#result h2{margin:6px 0 2px;font-family:'Sora';font-size:26px}
#result .dist{font-family:'Sora';font-size:46px;font-weight:800;color:var(--yellow);line-height:1.05;margin-top:8px}
#result .rows{margin:16px 0;display:grid;gap:6px;text-align:left}
#result .rows div{display:flex;justify-content:space-between;gap:10px;background:rgba(255,255,255,.04);border-radius:12px;padding:8px 12px;font-size:13.5px}
#result .earn{font-family:'Sora';font-size:22px;font-weight:800;color:var(--yellow)}
#result .acts{display:flex;gap:10px;margin-top:16px}
#result .acts button{flex:1;padding:13px;border-radius:999px;font-weight:800}
.rec{display:inline-block;background:var(--green);color:#052e16;font-weight:800;font-size:11px;letter-spacing:.14em;border-radius:999px;padding:5px 10px}
.win{border:1px solid rgba(74,222,128,.5);background:rgba(74,222,128,.1);border-radius:16px;padding:12px;margin-top:12px;font-size:13px;line-height:1.5}
.win b{color:var(--green)}
.miss{color:#fca5a5;font-weight:700;margin-top:6px;font-size:14px}
.tip{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}

.lline{display:flex;gap:8px;margin-top:5px}
.lline input{flex:1}
.lgrp{border-radius:16px;padding:12px;margin-top:14px}
.lgrp h4{margin:0 0 4px;font-family:'Sora';font-size:14px}
.lgrp.up{border:1px solid rgba(74,222,128,.45);background:rgba(74,222,128,.06)}
.lgrp.dn{border:1px solid rgba(251,113,133,.45);background:rgba(251,113,133,.06)}
.lrow{display:grid;grid-template-columns:1.5fr .8fr .8fr .8fr .7fr 52px;gap:6px;align-items:center;margin-top:6px}
.lrow.lh{font-size:9.5px;letter-spacing:.1em;color:var(--muted)}
.lrow .btn{padding:8px 0}
.lst{display:inline-block;margin-top:8px;font-size:12px;border-radius:999px;padding:4px 10px;border:1px solid var(--line)}
.lst.on{border-color:var(--green);color:var(--green)} .lst.bad{border-color:var(--red);color:var(--red)}
.lacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.lacts .btn{padding:10px 14px}
.gf{background:rgba(6,11,24,.84);border:1px solid var(--line);border-radius:14px;padding:7px 11px;font-size:13px;line-height:1.35;transition:opacity .6s;animation:gfin .3s}
.gf b{color:#fff} .gf.up{border-color:rgba(74,222,128,.7)} .gf.dn{border-color:rgba(251,113,133,.7)}
.gf small{display:block;color:var(--muted);font-size:11.5px}
@keyframes gfin{from{opacity:0;transform:translateX(-24px)}}
@media (max-width:560px){ .lrow{grid-template-columns:1.35fr 1fr 1fr 1fr 48px;gap:5px} .lrow .nm{grid-column:1/-1;margin-top:6px} .lrow.lh .nm{display:none} .lrow input{padding:8px 6px} .lrow.lh{font-size:8.5px;letter-spacing:.04em} }

#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;font-family:'Sora';font-size:15px;color:var(--muted)}

/* ---- layar sentuh / smartphone ---- */
#hud{padding-top:max(12px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
#topBtns{top:max(12px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right))}
#padL{left:max(16px,env(safe-area-inset-left))} #padR{right:max(16px,env(safe-area-inset-right))}
.pad{bottom:max(24px,calc(env(safe-area-inset-bottom) + 12px))}
.pad button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#garage{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.go{bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px))}
#topBtns .lbl{display:inline}
@media (max-width:760px){
  #topBtns{left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));max-width:none;gap:6px}
  #topBtns .round{padding:7px 10px;font-size:12px}
  #topBtns .lbl{display:none}
  #hud{padding-top:calc(max(12px,env(safe-area-inset-top)) + 42px);padding-left:12px;padding-right:12px}
  .hud-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .stat{border-radius:12px}
  .stat span{font-size:9px;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prog{max-width:none}
  .hud-sub .chip{font-size:11px;padding:3px 8px}
  .bars{max-width:180px}
  #garage{top:auto;height:64vh;height:64dvh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 14px calc(110px + env(safe-area-inset-bottom))}
  .go{right:16px;width:calc(100% - 32px)}
  .stat{min-width:0;padding:6px 8px}
  .stat b{font-size:15px}.stat.big b{font-size:17px}
  #hint{bottom:calc(176px + env(safe-area-inset-bottom));font-size:12px}
  #aimInfo{bottom:calc(246px + env(safe-area-inset-bottom));gap:6px}
  #aimInfo .stat b{font-size:14px}
  .pad button{width:60px;height:60px}
  #bRocket{width:70px;height:70px}
  .wallet{padding:7px 10px;font-size:14px}
  .logo b{font-size:15px}
  .gf{font-size:12px}
  .gf:nth-last-child(n+4){display:none}
}
@media (max-height:500px) and (orientation:landscape){
  #hud{padding-top:max(8px,env(safe-area-inset-top))}
  .hud-row{display:flex}
  .stat{padding:4px 9px;min-width:0}
  .stat span{font-size:8.5px}
  .stat b{font-size:14px}.stat.big b{font-size:17px}
  .prog{margin-top:5px;padding:4px 8px;max-width:340px}
  .hud-sub{margin-top:5px}.hud-sub .chip{font-size:10.5px;padding:2px 8px}
  .bars{margin-top:5px;gap:3px;max-width:160px}
  #topBtns{top:max(8px,env(safe-area-inset-top));left:auto;max-width:45vw}
  #topBtns .round{padding:6px 9px;font-size:12px}
  #topBtns .lbl{display:none}
  .pad{bottom:max(12px,env(safe-area-inset-bottom))}
  .pad .col{gap:8px}
  .pad button{width:52px;height:52px;font-size:19px;border-radius:16px}
  #bRocket{width:62px;height:62px;font-size:24px}
  #hint{bottom:12px;max-width:calc(100% - 300px);font-size:11.5px;padding:7px 12px}
  #aimInfo{bottom:60px}
  #aimInfo .stat b{font-size:14px}
  .gf{font-size:11.5px;padding:5px 9px}
  .gf:nth-last-child(n+3){display:none}
  .gf:nth-last-child(n+2) small{display:none}
  #garage{top:0;bottom:0;height:auto;width:min(420px,58%);border-radius:0;border-top:0;border-left:1px solid var(--line);padding:14px 14px 90px}
  .go{right:12px;width:min(390px,calc(58% - 24px));padding:12px;font-size:15px}
  #result{padding:14px;max-height:calc(100% - 16px)}
  #result .dist{font-size:32px}
  #result .rows{margin:8px 0}
}
#cheatPanel{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(2,6,16,.72);padding:16px}
#cheatPanel .cp{width:min(440px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#cheatPanel h3{margin:0 0 2px;font-family:'Sora';font-size:18px}
#cheatPanel .sub{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:8px}
#cheatPanel label{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
#cheatPanel input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:#facc15;flex:none}
#cheatPanel label b{display:block;font-size:14px}
#cheatPanel label small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
#cheatPanel label.dis{opacity:.4;cursor:not-allowed}
#cheatPanel .x{margin-top:12px;width:100%;padding:12px;border-radius:14px;border:0;background:var(--yellow);color:#111;font-weight:800}
/* tampilan layar sentuh (Android): tombol roket besar di kanan bawah, panah atas-bawah disembunyikan */
body.touch #padL{display:none!important}
body.touch #padR .col{display:none}
body.touch #padR{right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom))}
body.touch #bRocket{width:92px;height:92px;font-size:38px;border-radius:26px;opacity:.9}
body.touch #hint{bottom:max(14px,env(safe-area-inset-bottom));font-size:12.5px;max-width:calc(100% - 200px);text-align:left;white-space:normal}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="loading">Menyiapkan landasan…</div>

<div id="hud">
  <div class="hud-row">
    <div class="stat big"><span>JARAK</span><b id="hDist">0 m</b></div>
    <div class="stat"><span>TINGGI</span><b id="hAlt">0 m</b></div>
    <div class="stat"><span>KECEPATAN</span><b id="hSpd">0</b></div>
    <div class="stat coin"><span>KOIN</span><b id="hCoins">0</b></div>
  </div>
  <div class="prog"><span id="hLevel">LEVEL 1</span><i><u id="uProg"></u></i></div>
  <div class="hud-sub"><span class="chip" id="hWind"></span><span class="chip" id="hBiome"></span><span class="chip" id="hStall" style="display:none;background:#b91c1c;border-color:#fb7185">⚠ STALL</span></div>
  <div class="bars">
    <div class="bar" id="barEng">MESIN<i><u id="uEng" style="background:var(--sky)"></u></i></div>
    <div class="bar" id="barRkt">ROKET<i><u id="uRkt" style="background:#f97316"></u></i></div>
  </div>
</div>

<div id="topBtns">
  <button class="round" id="bFast" style="display:none">⏩ 1×</button>
  <button class="round" id="bSkip" style="display:none">⏭ Selesai</button>
  <button class="round" id="btnMute">🔊</button>
    <button class="round" id="btnGarage" aria-label="Garasi">🔧<span class="lbl"> Garasi</span></button>
</div>

<div id="aimInfo"><div class="stat"><span>TARIKAN</span><b id="aPow">0%</b></div><div class="stat"><span>SUDUT</span><b id="aAng">0°</b></div><div class="stat"><span>LAJU LEPAS</span><b id="aSpd">0</b></div></div>
<div id="hint"></div>

<div class="pad" id="padL"><button id="bLeft" aria-label="Belok kiri">◀</button><button id="bRight" aria-label="Belok kanan">▶</button></div>
<div class="pad" id="padR">
  <div class="col"><button id="bUp" aria-label="Hidung naik">▲</button><button id="bDown" aria-label="Hidung turun">▼</button></div>
  <button id="bRocket" aria-label="Roket">🚀</button>
</div>

<div id="garage" class="overlay"></div>
<button class="go" id="btnGo">▶ KE KETAPEL</button>
<div id="result" class="overlay"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ================= UTIL ================= */
const $ = id => document.getElementById(id);
const fmt = n => Math.floor(n).toLocaleString('id-ID');
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const smooth = (a,b,x) => { const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const wrap = a => { if(!Number.isFinite(a)) return 0; a=(a+Math.PI)%(2*Math.PI); if(a<0) a+=2*Math.PI; return a-Math.PI; };
let RNG=Math.random;   // generator acak aktif (dibuat tetap per potongan peta saat looping)
const rand = (a,b) => a+RNG()*(b-a);

// generator acak bibit tetap (mulberry32): potongan peta yang sama selalu identik
const seededRNG=(s)=>()=>{ s=s+0x6D2B79F5|0; let q=Math.imul(s^s>>>15,1|s); q=q+Math.imul(q^q>>>7,61|q)^q; return ((q^q>>>14)>>>0)/4294967296; };
const G = 9.81;

/* ================= SAVE ================= */

  {name:'Mainan Kayu',      emoji:'🪵', mass:1.6, cd0:0.034, area:0.26, ar:6.0, thrust:6,  fuel:5,  size:1.5, color:0xb7793f, wheels:false},
  {name:'Mainan RC',        emoji:'🎮', mass:2.2, cd0:0.030, area:0.24, ar:7.0, thrust:10, fuel:8,  size:1.7, color:0xef4444, wheels:true},
  {name:'Biplan Ultralight', emoji:'🦋', mass:3.0, cd0:0.026, area:0.30, ar:10,  thrust:13, fuel:10, size:2.1, color:0x22c55e, wheels:true},
  {name:'Jet Bisnis',       emoji:'🛩️', mass:4.4, cd0:0.023, area:0.26, ar:8.5, thrust:24, fuel:10, size:2.5, color:0x38bdf8, wheels:true},

  const L=curLevel(), tier=FREE.on?FREE.plane:(CHT.free&&CHT.pick?CHT.pick:L.plane), B=BODIES[tier-1], SZ=B.size*CHT.size;

  s.hb=(B.wheels?0.2:0.12)*SZ; s.muMul=B.wheels?0.3:1; s.pr=0.35*SZ;
  // Ketapel = pegas: v = √(η·k·x² / m). Konstanta & massa seperti versi awal game, naik tiap upgrade ketapel.
  const l=save.sling-1, w=save.wing, p=save.prop, r=save.rocket, k=650*Math.pow(1.06,l), maxX=1.3+0.09*l, eff=0.62+0.02*l;
  const mSling=B.mass*(1+0.02*(w-1))+0.03*p*B.mass+(r>0?(0.12+0.02*r+0.005*r)*Math.sqrt(B.mass):0);
  const vFroude=s.vLaunch;
  s.vLaunch=frac=>Math.max(Math.sqrt(eff*k*Math.pow(maxX*frac,2)/(mSling+0.15)), vFroude(frac)*(1+0.06*l));
  return Object.assign(s,{L,B,maxX:1.3+0.09*(save.sling-1),mult:coinMult()});
}

/* ================= RENDERER & SCENE ================= */

const sky=new THREE.Mesh(new THREE.SphereGeometry(1800,32,16),new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false, toneMapped:false,
  uniforms:{top:{value:new THREE.Color(0x2b74d6)},bot:{value:new THREE.Color(0xd6eeff)}},
  vertexShader:`varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h=clamp(vP.y*1.6+0.12,0.0,1.0); gl_FragColor=vec4(mix(bot,top,h),1.0);

scene.add(sky);
const hemi=new THREE.HemisphereLight(0xe0f2ff,0x557744,1.1); scene.add(hemi);
// langit: siang → malam bertahap sesuai ketinggian (0 → 750 m), bintang muncul di malam hari
const SKY_DAY={top:new THREE.Color(0x2b74d6), bot:new THREE.Color(0xd6eeff)};
const SKY_NIGHT={top:new THREE.Color(0x010208), bot:new THREE.Color(0x0a1028)};
const _sc=new THREE.Color();
const starGeo=new THREE.BufferGeometry(); const SN=1400, sPos=new Float32Array(SN*3);
for(let i=0;i<SN;i++){ const a=rand(0,6.283), e=rand(0.05,1.45), r=1500;
  sPos[i*3]=r*Math.cos(e)*Math.cos(a); sPos[i*3+1]=r*Math.sin(e); sPos[i*3+2]=r*Math.cos(e)*Math.sin(a); }
starGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:2.2,sizeAttenuation:false,transparent:true,opacity:0,depthWrite:false,fog:false}));
stars.frustumCulled=false; scene.add(stars);
function updateSky(alt){
  const n=clamp(alt/750,0,1);                      // 0 = siang, 1 = malam (750 m ke atas)
  sky.material.uniforms.top.value.copy(_sc.copy(SKY_DAY.top).lerp(SKY_NIGHT.top,n));
  sky.material.uniforms.bot.value.copy(_sc.copy(SKY_DAY.bot).lerp(SKY_NIGHT.bot,n));
  scene.fog.color.copy(_sc.copy(SKY_DAY.bot).lerp(SKY_NIGHT.bot,n));
  hemi.intensity=1.1-0.85*n; sun.intensity=2.2-1.9*n;
  // lantai tetap terlihat di malam hari: pendar tipis dari warna bioma (tidak menyatu dengan kabut gelap)
  MAT.ground.forEach((m,i)=>{ m.emissive.setHex(BIOMES[i].color).multiplyScalar(0.35*n); });
  stars.material.opacity=clamp((n-0.3)/0.7,0,1);
  stars.position.copy(camera.position);
}
const sun=new THREE.DirectionalLight(0xfff3dd,2.2);
sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:700});
sun.shadow.bias=-0.0005;
scene.add(sun); scene.add(sun.target);
function placeSun(x,y,z){ sun.position.set(x+40,y+80,z+45); sun.target.position.set(x,y,z); }
function onResize(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); if(typeof setView==='function') setView(); }
addEventListener('resize',onResize);
addEventListener('orientationchange',()=>{ setTimeout(onResize,150); setTimeout(onResize,600); });
// Kualitas adaptif: kalau HP berat (< ~25 fps), turunkan resolusi lalu matikan bayangan
let perfT=0, perfN=0, perfLast=performance.now();
function adaptQuality(){
  const n=performance.now(), d=n-perfLast; perfLast=n; if(d>250||document.hidden) return;
  perfT+=d; perfN++; if(perfT<2500) return;
  const avg=perfT/perfN; perfT=0; perfN=0;
  if(avg>40 && dpr>1){ dpr=Math.max(1,dpr-0.25); renderer.setPixelRatio(dpr); renderer.setSize(innerWidth,innerHeight); }
  else if(avg>45 && renderer.shadowMap.enabled){ renderer.shadowMap.enabled=false;
    scene.traverse(o=>{ const m=o.material; if(m) (Array.isArray(m)?m:[m]).forEach(x=>x.needsUpdate=true); }); }
}

/* ================= MATERIAL & GEOMETRI ================= */
const std = (c,o={}) => new THREE.MeshStandardMaterial({color:c,roughness:0.75,metalness:0.05,flatShading:true,...o});
const dotTex=(()=>{ const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,30); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.55,'rgba(255,255,255,.85)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })();
// tekstur tanah, jalan, dan bentuk batu menjulang (dibuat dari kode)
function noiseTex(base,dark,light){
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  g.fillStyle=base; g.fillRect(0,0,256,256);
  for(let i=0;i<2600;i++){ g.fillStyle=Math.random()<0.5?dark:light; g.globalAlpha=0.25+Math.random()*0.35; g.fillRect(Math.random()*256,Math.random()*256,2+Math.random()*3,2+Math.random()*3); }
  g.globalAlpha=1;
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,30); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function roadTex(road,edge,dashed){
  const c=document.createElement('canvas'); c.width=512; c.height=128; const g=c.getContext('2d');
  g.fillStyle=edge; g.fillRect(0,0,512,128);
  g.fillStyle=road; g.fillRect(0,14,512,100);
  g.fillStyle='rgba(255,255,255,0.85)'; g.fillRect(0,13,512,2); g.fillRect(0,113,512,2);
  if(dashed){ g.fillStyle='rgba(250,250,240,0.95)'; for(let x=0;x<512;x+=64) g.fillRect(x+6,62,36,4); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function makeSpire(){ const g=new THREE.CylinderGeometry(0.5,1,1,9,6).translate(0,0.5,0); const p=g.attributes.position;
  for(let i=0;i<p.count;i++){ const j=0.85+0.3*Math.abs(Math.sin(i*7.13)); p.setX(i,p.getX(i)*j); p.setZ(i,p.getZ(i)*j); }
  g.computeVertexNormals(); return g; }

const GEO = {
  ground:new THREE.PlaneGeometry(100,1000).rotateX(-Math.PI/2),
  trunk:new THREE.CylinderGeometry(0.25,0.35,2,6).translate(0,1,0),
  leaf:new THREE.ConeGeometry(1.7,4,7).translate(0,3.8,0),
  mesa:new THREE.CylinderGeometry(1,1.15,1,7).translate(0,0.5,0),
  bld:new THREE.BoxGeometry(1,1,1).translate(0,0.5,0),
  cloud:new THREE.IcosahedronGeometry(1,1),
  coin:new THREE.CylinderGeometry(0.9,0.9,0.22,24),
  ball:new THREE.SphereGeometry(1,16,12),
  post:new THREE.BoxGeometry(0.15,1.6,0.15).translate(0,0.8,0),
  thermal:new THREE.CylinderGeometry(1,1,1,20,1,true).translate(0,0.5,0),
  unitCyl:new THREE.CylinderGeometry(1,1,1,8),
  tower:new THREE.CylinderGeometry(0.7,1,1,10).translate(0,0.5,0),
  bird:new THREE.ConeGeometry(0.35,1.1,5).rotateZ(-Math.PI/2),

  trunk:std(0x7c4a24), leaf:[std(0x2f8f46),std(0x3aa357),std(0x23703a)],

const labelCache=new Map();
function label(text,bg='#0b1428',fg='#facc15'){
  const key=text+bg+fg; if(labelCache.has(key)) return labelCache.get(key);
  const c=document.createElement('canvas'); c.width=256; c.height=96;
  const x=c.getContext('2d');
  x.fillStyle=bg; x.beginPath(); if(x.roundRect) x.roundRect(6,10,244,76,22); else x.rect(6,10,244,76); x.fill();
  x.fillStyle=fg; x.font='800 44px Sora, sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(text,128,50);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.SpriteMaterial({map:t,fog:true}); labelCache.set(key,m); return m;

/* ================= DUNIA (chunk prosedural per level) ================= */
const DECOR=true;      // dekorasi peta dari aset baru (rumah, gedung, pohon, batu) di sisi jalur
const EMPTY_MAP=false;  // dekorasi & rintangan peta aktif
const CH=100; const chunks=new Map();
let rings=[], obstacles=[], thermals=[], storms=[];
const LANE=22; // lebar jalur terbang (±m)

function makeChunk(i){
  const savedRNG=RNG, ci=((i%(LOOP_M/CH))+(LOOP_M/CH))%(LOOP_M/CH); RNG=seededRNG(ci*7919+13);
  const L=curLevel(), x0=i*CH, b=biomeAt(Math.max(0,x0+1)), grp=new THREE.Group(), items={rings:[],obstacles:[],thermals:[],storms:[]};
  const ground=new THREE.Mesh(GEO.ground,MAT.ground[b]); ground.position.set(x0+CH/2,0,0); ground.receiveShadow=true; grp.add(ground);
  if(b===2||b===0){ const rd=new THREE.Mesh(GEO.road,b===2?MAT.roadCity:MAT.roadDirt); rd.position.set(x0+CH/2,0.04,0); grp.add(rd); }
  const add=(geo,mat,x,y,z,sx,sy,sz,ry=0)=>{ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.scale.set(sx,sy??sx,sz??sx); m.rotation.y=ry; grp.add(m); return m; };
  const solid=o=>{ if(Object.values(o).every(v=>typeof v!=='number'||Number.isFinite(v))) items.obstacles.push(o); };

  // Semua dekorasi peta dari tile aset (hutan & kota). Setiap tile SOLID: kotak tabrakan = bounding box geometri aslinya.
  const pick=pack=>pack[(RNG()*pack.length)|0].clone(true);
  const solidTile=t=>{ t.updateMatrixWorld(true); const bb=new THREE.Box3().setFromObject(t), c=bb.getCenter(new THREE.Vector3()), s=bb.getSize(new THREE.Vector3());
    solid({type:'box',x:c.x,z:c.z,hx:s.x/2,hz:s.z/2,h:bb.max.y}); };
  // dekorasi di sisi jalur: geser keluar bila menyentuh jalur terbang (LANE)
  const tiles=(pack,n,near,far,smin,smax)=>{ if(!pack.length) return; for(const sd of [-1,1]) for(let k=0;k<n;k++){
    const t=pick(pack); t.scale.setScalar(rand(smin,smax)); t.rotation.y=((RNG()*4)|0)*Math.PI/2; t.position.set(x0+rand(0,CH),0,sd*rand(near,far)); grp.add(t);

function dropChunk(i){

  scene.remove(c.grp);

  obstacles=obstacles.filter(r=>!c.items.obstacles.includes(r));
  thermals=thermals.filter(r=>!c.items.thermals.includes(r));
  storms=storms.filter(s=>!c.items.storms.includes(s));
  chunks.delete(i);
}
function ensureChunks(x){
  const a=Math.floor((x-200)/CH), b=Math.floor((x+800)/CH);
  for(let i=a;i<=b;i++) if(!chunks.has(i)){

    try{ makeChunk(i); }
    catch(e){ console.error('chunk '+i+' gagal dibuat:',e); chunks.set(i,{grp:new THREE.Group(),items:{rings:[],obstacles:[],thermals:[],storms:[]}}); }

}

const air=[0,0,0];
/* ================= FISIKA (data pesawat nyata, diskalakan Froude ke ukuran model) =================
   Massa ∝ λ³, luas sayap ∝ λ², kecepatan lepas ∝ √λ (λ = panjang model di game / panjang asli).
   Gaya: berat mg, lift ½ρv²S·CL, drag ½ρv²S·CD (CD = CD0 + CL²/(πe·AR)), dorong = rasio dorong×berat,
   ρ turun dengan ketinggian, angin profil pangkat (naik dengan tinggi) + hembusan + thermal.
   Pilot hanya mengatur pitch (tanpa autopilot yang mengimbangi lift). */
const REAL=[
  {L:0.21, b:0.21, S:0.022,  m:0.005,  cd0:0.050, e:0.70, tw:0.00, vl:7,  as:0.42, fuel:0, fm:1},  // kertas (origami)

  {L:1.0,  b:1.4,  S:0.25,   m:1.4,    cd0:0.040, e:0.75, tw:0.60, vl:12, as:0.30, fuel:8, fm:5},  // mainan RC

  {L:15.0, b:14.0, S:30,     m:4600,   cd0:0.022, e:0.80, tw:0.35, vl:50, as:0.30, fuel:12, fm:6}, // jet bisnis
  {L:37.6, b:35.8, S:122.6,  m:60000,  cd0:0.025, e:0.80, tw:0.31, vl:75, as:0.30, fuel:12, fm:6}, // jet penumpang

const WING_AREA=[0.22,0.55,1.0,1.06,1.12,1.22,1.32,1.45,1.6,1.78];
// s: keadaan pesawat untuk satu terbang (dihitung sekali per pemasangan)
function planeStats(tier, size, wing, prop, rocket){
  const R=REAL[tier-1], lam=(1.3*size)/R.L;
  const S=R.S*lam*lam*WING_AREA[wing-1];                    // luas sayap model (m²)
  const AR=R.b*R.b/R.S;                                     // rasio aspek (tidak berubah skala)
  const mass=R.m*Math.pow(lam,3)*(1+0.02*(wing-1))*(1+0.03*prop)*(1+0.02*rocket);
  const CLA=2*Math.PI*AR/(AR+2);                            // kemiringan lift (lifting-line)
  const thrust = prop>0 ? R.tw*mass*G*(0.5+0.05*prop) : 0;  // dorong = rasio dorong × berat
  const fuel   = prop>0 && R.tw>0 ? R.fuel*R.fm*(0.5+0.05*prop) : 0;   // durasi mesin (aturan permainan, bukan fisika)
  const rThrust= rocket>0 ? mass*G*(0.5+0.1*rocket) : 0;    // roket tambahan (dorongan = ½–1,5 berat)
  const rBurn  = rocket>0 ? 1+0.25*rocket : 0;
  return {
    R, lam, S, AR, mass, CL0:0.2, CLA, aStall:R.as, e:R.e, cd0:R.cd0*(wing<4?1.25:1)*(1-0.01*(wing-1)),
    thrust, fuel, rThrust, rBurn, rFuelMass:0.03*mass*rBurn,
    vLaunch:(frac)=>R.vl*Math.sqrt(lam)*frac,               // kecepatan lepas (Froude)
    stab: wing>=4?1:0.4, yawStab: wing>=5?1:0.4, asym: wing===2?1:0,
    size, hb:(R.tw>0||R.fuel>0?0.2:0.12)*size,
    muMul: R.tw>0?0.3:1,
  };
}
const lift0=(a,s,as)=>{ const lin=s.CL0+s.CLA*clamp(a,-as,as); const f=smooth(as,as+0.2,Math.abs(a)); return lin*(1-f)+0.9*Math.sin(2*a)*f; };
// angin: profil pangkat ke atas (ketinggian 10 m jadi acuan), plus hembusan
// kekuatan badai di posisi pesawat (0 = di luar, 1 = pusat badai)
function stormAt(x,y,z){ let s=0; for(const w of storms){ if(y>w.top) continue; const d=Math.hypot(x-w.x,z-w.z); if(d<w.r) s=Math.max(s,smooth(w.r,w.r*0.2,d)); } return s; }
function windAt(p,t){
  const k=Math.pow(Math.max(p.y,1)/10,0.143);
  const g=Math.sin(t*0.9+wind.ph)*Math.sin(t*0.37+1.3);
  air[0]=(wind.base+wind.gust*g)*k;
  air[1]=0.25*wind.gust*Math.sin(t*1.3+wind.ph*2)*k*0.5;
  air[2]=(wind.cross+0.6*wind.gust*Math.sin(t*0.53+wind.ph))*k;
  const sw=stormAt(p.x,p.y,p.z);   // badai: angin kencang berubah arah (melambatkan & membelokkan pesawat)
  if(sw>0){ air[0]+=sw*(-7+4*Math.sin(t*1.9)); air[2]+=sw*5*Math.sin(t*1.3+1.0); air[1]+=sw*4*Math.sin(t*2.7); }
  for(const th of thermals){ const dx=p.x-th.x, dz=p.z-th.z, d2=dx*dx+dz*dz;
    if(d2<th.r*th.r && p.y<th.top) air[1]+=th.w*(1-d2/(th.r*th.r))*Math.min(1,(th.top-p.y)/20); }
  return air;
}
// satu langkah fisika. u: kendali pitch (-1..1). Tanpa autopilot: pitch berubah hanya karena input.
function stepPhys(p,s,dt,u,lr,rocketOn,t){
  const A=windAt(p,t);
  const sS=stormAt(p.x,p.y,p.z);   // kekuatan badai di sini
  const AS=CHT.stall?1.9:s.aStall;   // antijatuh: stall baru terjadi di atas ~109°
  const vrx=p.vx-A[0], vry=p.vy-A[1], vrz=p.vz-A[2];          // kecepatan relatif udara
  const V=Math.hypot(vrx,vry,vrz)+1e-6, ux=vrx/V, uy=vry/V, uz=vrz/V;
  const gam=Math.asin(clamp(uy,-1,1));

    // efektivitas elevator ∝ tekanan dinamis: pada kecepatan rendah pitch tidak bisa diputar liar

  const sx=uy*upz-uz*upy, sy=uz*upx-ux*upz, sz=ux*upy-uy*upx;

  let fx=-D*ux+L*lx, fy=-D*uy+L*ly, fz=-D*uz+L*lz, T=0;
  if(s.yawStab<1 && !p.onGround) fz+=(1-s.yawStab)*q*s.S*0.12*Math.sin(t*1.7+0.4);

  if(rocketOn && p.rfuel>0 && !p.crashed){ T+=s.rThrust; p.rfuel-=dt; p.m-=s.rFuelMass/s.rBurn*dt; p.burning=true; }

  fx+=T*Math.cos(p.theta)*hx; fz+=T*Math.cos(p.theta)*hz; fy+=T*Math.sin(p.theta)-p.m*G;

  const dvm=Math.hypot(dvx,dvy,dvz), dvLim=Math.max(V,5)*0.5;   // perubahan kecepatan per langkah tidak melebihi setengah kecepatan
  if(dvm>dvLim){ const k=dvLim/dvm; dvx*=k; dvy*=k; dvz*=k; }
  p.vx+=dvx; p.vy+=dvy; p.vz+=dvz;
  p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;

    p.y=s.hb;
    if(p.vy<0){ const imp=-p.vy; p.impact=imp; if(imp>2.5){ p.vy=imp*0.25; p.vx*=0.88; p.vz*=0.88; } else p.vy=0; }
    const bi=biomeAt(p.x), mu=BIOMES[bi].mu*(bi===3?1:s.muMul)*(p.crashed?2.5:1);
    const N=Math.max(0,p.m*G-Math.max(0,L*ly));
    const dec=mu*N/p.m*dt, hs=Math.hypot(p.vx,p.vz);
    if(hs<=dec){ p.vx=0; p.vz=0; } else { const k=(hs-dec)/hs; p.vx*=k; p.vz*=k; }
    p.onGround=true;
  } else if(p.y>s.hb+0.05) p.onGround=false;
}

/* ================= MODEL PESAWAT (realistis, bagian bertambah tiap upgrade) ================= */
const ASSET={plane:[],kota:[],hutan:[]};
// Muat semua aset GLB (7 pesawat + 2 paket peta). Gagal muat → pesawat kotak sederhana.
function loadAssets(){
  const gl=new GLTFLoader(); gl.setMeshoptDecoder(MeshoptDecoder);
  const one=url=>new Promise(res=>gl.load(url,g=>res(g.scene),undefined,()=>res(null)));
  // tiap tile dibungkus Group agar transform bawaan node (hasil kuantisasi) tidak tertimpa saat ditempatkan
  const pack=url=>new Promise(res=>gl.load(url,g=>res([...g.scene.children].map(c=>{ const h=new THREE.Group(); h.add(c); return h; })),undefined,()=>res([])));
  $('loading').textContent='Memuat pesawat & peta…';
  // aset baru: setiap objek dipusatkan di xz dan alasnya di y=0 agar pas ditempatkan di tanah
  const packN=url=>new Promise(res=>gl.load(url,g=>res([...g.scene.children].map(c=>{ const h=new THREE.Group(); h.add(c);
    const bb=new THREE.Box3().setFromObject(h); c.position.x-=(bb.min.x+bb.max.x)/2; c.position.y-=bb.min.y; c.position.z-=(bb.min.z+bb.max.z)/2;
    h.userData.size=new THREE.Box3().setFromObject(h).getSize(new THREE.Vector3()); h.userData.name=c.name||''; return h; })),undefined,()=>res([])));
  return Promise.all([
    Promise.all([1,2,3,4,5,6,7].map(i=>one(`assets/planes/p${i}.glb`))),
    pack('assets/map/kota.glb'), pack('assets/map/hutan.glb'),
    packN('assets/map/gedung.glb'), packN('assets/map/pohon.glb')
  ]).then(([planes,kota,hutan,gedung,pohon])=>{
    for(const pk of [kota,hutan]) for(const h of pk) h.userData.size=new THREE.Box3().setFromObject(h).getSize(new THREE.Vector3());
    ASSET.plane=planes; ASSET.kota=kota; ASSET.hutan=hutan;
    // buang objek lempeng raksasa (dasar/platform) yang bisa jadi dinding tak terlihat
    const okB=h=>{ const z=h.userData.size; return Number.isFinite(z.x)&&Number.isFinite(z.z)&&Math.max(z.x,z.z)<=150 && z.y>=4; };
    ASSET.rumah=gedung.filter(h=>okB(h)&&h.userData.size.y<30);            // bangunan rendah / rumah
    ASSET.gedung=gedung.filter(h=>okB(h)&&h.userData.size.y>=30);          // gedung tinggi
    const fin=h=>{ const z=h.userData.size; return Number.isFinite(z.x)&&Number.isFinite(z.y)&&Number.isFinite(z.z)&&z.x>0&&z.y>0&&z.z>0; };
    ASSET.pohon=pohon.filter(h=>fin(h)&&h.userData.name.startsWith('Background_Tree_Atlas'));   // pohon utuh
    ASSET.batu=pohon.filter(h=>fin(h)&&h.userData.name.startsWith('Rocks'));                    // batuan canyon
  });
}

function lathe(len,R,profile,mat,seg=28){
  const pts=profile.map(([t,f])=>new THREE.Vector2(Math.max(0.0005,f*R),(t-0.5)*len));
  const geo=new THREE.LatheGeometry(pts,seg); geo.rotateZ(-Math.PI/2);
  return new THREE.Mesh(geo,mat);
}
// Panel sayap/ekor meruncing dengan penampang airfoil sederhana
// Badan = model GLB yang sudah dinormalkan (hidung +X, bawah roda di y=-hb).
// Upgrade sayap/ekor mengikuti ukuran model. Mesin (baling-baling/jet) dan roket = tambahan.
// Pesawat dibangun dari bagian asli model (body, sayap, ekor, sirip, mesin, roda, baling-baling).
// Level upgrade menampilkan bagian satu per satu; sisi yang hilang dicerminkan dari sisi lainnya.
function buildPlane(s){
  const g=new THREE.Group(); g.rotation.order='YZX';
  const sz=s.size, tier=s.L.plane, w=save.wing, p=save.prop, r=save.rocket, hb=s.hb, hasEng=s.thrust>0;
  const parts={group:g,prop:null,props:[],propL:null,propR:null,flames:[],nozzles:[],noseX:0};
  const gold=new THREE.MeshStandardMaterial({color:0xfacc15,metalness:0.9,roughness:0.25});
  const dark=new THREE.MeshStandardMaterial({color:0x1f2937,roughness:0.6}), chrome=new THREE.MeshStandardMaterial({color:0xe5e7eb,metalness:0.95,roughness:0.15});
  const acc=c=>new THREE.MeshStandardMaterial({color:c,roughness:0.5,metalness:0.1,side:THREE.DoubleSide});
  const add=(m,x,y,z)=>{ m.position.set(x,y,z); g.add(m); return m; };
  const box=(a,b,c,mat,x,y,z)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),mat); m.castShadow=true; return add(m,x,y,z); };
  const bboxOf=o=>new THREE.Box3().setFromObject(o);

  let L=1.3*sz, hL=L/2;
  let model=null, W=[null,null], T=[null,null], E=[null,null], fin=null, gear=null, prop=null, body=null, extraL=null, extraR=null, yC=-hb+0.3*sz;
  const src=ASSET.plane[tier-1];
  if(src){
    // 1. skala dari seluruh model (semua bagian), pusat sumbu di tengah
    model=cloneRig(src); g.add(model); model.updateMatrixWorld(true);
    const d0=bboxOf(model).getSize(new THREE.Vector3());
    const k=L/d0.x; model.scale.setScalar(k); model.updateMatrixWorld(true);
    const c1=bboxOf(model).getCenter(new THREE.Vector3());
    model.position.set(-c1.x,0,-c1.z); model.updateMatrixWorld(true);
    L=d0.x*k; hL=L/2;
    model.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
    // 2. ambil bagian; sisi yang tidak ada dicerminkan dari sisi lain
    const pair=(a,b)=>[model.getObjectByName(a),model.getObjectByName(b)];   // apa adanya, tanpa cermin
    W=pair('wingL','wingR'); T=pair('tailL','tailR'); E=pair('engineL','engineR');
    fin=model.getObjectByName('fin'); gear=model.getObjectByName('gear'); body=model.getObjectByName('body'); extraL=model.getObjectByName('extraL'), extraR=model.getObjectByName('extraR');
    prop=model.getObjectByName('prop');
    if(prop){ // baling-baling berputar pada pusatnya, sumbu = arah tegak lurus cakram (varians terkecil)
      g.updateMatrixWorld(true);
      const pts=[]; prop.traverse(o=>{ if(o.isMesh && o.geometry.attributes.position){ const pos=o.geometry.attributes.position, v=new THREE.Vector3();
        for(let i=0;i<pos.count;i++) pts.push(v.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld).clone()); } });
      const cen=new THREE.Vector3(); pts.forEach(q=>cen.add(q)); if(pts.length) cen.divideScalar(pts.length);
      let axis=new THREE.Vector3(1,0,0), best=Infinity;
      for(let k=0;k<400 && pts.length;k++){ const phi=Math.acos(1-2*(k+0.5)/400), th=Math.PI*(1+Math.sqrt(5))*k;
        const d=new THREE.Vector3(Math.sin(phi)*Math.cos(th),Math.sin(phi)*Math.sin(th),Math.cos(phi)); let s=0,s2=0;
        for(const q of pts){ const x=q.clone().sub(cen).dot(d); s+=x; s2+=x*x; } const vr=s2/pts.length-(s/pts.length)**2;
        if(vr<best){ best=vr; axis=d; } }
      const pv=new THREE.Group(); pv.name='propPivot'; pv.position.copy(cen); pv.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),axis);
      const spin=new THREE.Group(); spin.name='propSpin'; pv.add(spin); g.add(pv); pv.updateMatrixWorld(true); spin.attach(prop); spin.visible=false;   // baling-baling model disembunyikan; yang dipakai baling-baling awal
    }
  } else { box(L,0.2*sz,0.2*sz,acc(0xf8fafc),0,0,0); }

  // 3. tampilkan bagian sesuai upgrade
  const eng=[E[0],E[1]];
  const setVis=()=>{
    if(W[0]) W[0].visible=w>=2; if(W[1]) W[1].visible=w>=3;
    if(fin) fin.visible=w>=4;                       // upgrade 3: sirip belakang
    T.forEach(o=>{ if(o) o.visible=w>=5; });        // upgrade 4: sayap belakang horizontal
    if(gear) gear.visible=w>=6;
    if(extraL) extraL.visible=w>=2; if(extraR) extraR.visible=w>=3;   // strut & pangkal sayap ikut sisi sayapnya
    if(eng[0]) eng[0].visible=p>=1; if(eng[1]) eng[1].visible=p>=2;   // tampilan mesin ikut upgrade (dorongan tetap dihitung di fisika)
    if(parts.prop) parts.prop.visible=p>=1;
  };
  setVis();
  // 4. letakkan model: bagian terbawah yang terlihat tepat di -hb (roda atau badan)
  if(model){
    g.updateMatrixWorld(true);
    // baling-baling tidak ikut menentukan titik terbawah (saat diam bilahnya tidak menyentuh tanah)
    const vis=[body,extraL,extraR,W[0],W[1],T[0],T[1],fin,gear,eng[0],eng[1]].filter(o=>o&&o.visible);
    const bx=new THREE.Box3(); vis.forEach(o=>bx.union(bboxOf(o)));
    model.position.y=-hb-bx.min.y; g.updateMatrixWorld(true);
    bx.makeEmpty(); vis.forEach(o=>bx.union(bboxOf(o)));

  parts.noseX=hL;

  // 5. posisi knalpot mesin jet (untuk asap), tanpa menambah bagian

  engPos.forEach(e=>parts.nozzles.push(e.rear));   // titik asap knalpot jet (efek partikel, bukan bagian)

  // 6b. baling-baling seperti versi awal game: menempel di hidung, bilah & aksesori bertambah tiap upgrade
  parts.prop=null; parts.props=[];
  if(tier>=2 && tier<=5){
    const ps=tier===5?1.5:1;   // pesawat 5: moncong & bilah dibesarkan agar sesuai bodi
    // pusat baling-baling: pesawat 4 mengikuti tinggi hidung badan (0,215 panjang dari dasar); pesawat 5 seperti sebelumnya
    const pyc=tier===4?(-hb+0.215*L):tier===5?yC-0.05*sz:yC;
    const cr=tier===4?1.4:1;   // pesawat 4: cowling sebanding dengan jari-jari hidung
    const pm = p>=9?gold:new THREE.MeshStandardMaterial({color:0x1f2937,roughness:0.35,metalness:0.3});
    const blades = p>=8?5:p>=6?4:p>=3?3:2, len=(0.16+0.012*p)*sz*ps;
    const pr=new THREE.Group(); pr.name='propProc';
    for(let i=0;i<blades;i++){ const holder=new THREE.Group(); holder.rotation.x=i/blades*Math.PI*2;
      const bl=new THREE.Mesh(new THREE.BoxGeometry(0.012*sz*ps,len,0.045*sz*ps),pm); bl.position.y=len/2; bl.rotation.y=0.35; holder.add(bl);
      if(p>=6){ const tip=new THREE.Mesh(new THREE.BoxGeometry(0.013*sz*ps,0.03*sz*ps,0.046*sz*ps),new THREE.MeshBasicMaterial({color:0xfacc15})); tip.position.y=len-0.015*sz; tip.rotation.y=0.35; holder.add(tip); }
      pr.add(holder); }
    if(p>=2){ const sp=new THREE.Mesh(new THREE.ConeGeometry(0.04*sz*ps,0.09*sz*ps,16),p>=9?gold:new THREE.MeshStandardMaterial({color:0xdc2626,metalness:0.3,roughness:0.3})); sp.rotation.z=-Math.PI/2; sp.position.x=0.04*sz*ps; pr.add(sp); }
    else { const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.02*sz*ps,0.02*sz*ps,0.03*sz*ps,10),dark); hub.rotation.z=Math.PI/2; pr.add(hub); }
    pr.position.set(hL+0.015*sz,pyc,0); pr.visible=p>=1; g.add(pr);
    if(p>=4){ const cw=lathe(0.16*sz*ps,0.085*sz*ps*cr,[[0,1],[.6,.95],[1,.6]],p>=10?gold:chrome,20); cw.position.set(hL-0.07*sz*ps,pyc,0); pr.parent.add(cw); cw.visible=p>=1; }
    if(p>=5) for(const sd of [-1,1]){ const ex=new THREE.Mesh(new THREE.CylinderGeometry(0.01*sz,0.012*sz,0.12*sz,8),chrome); ex.rotation.z=-Math.PI/2; ex.position.set(hL-0.2*sz,yC-0.05*sz,sd*0.075*sz); g.add(ex); ex.visible=p>=1; }
    if(p>=7){ const intake=new THREE.Mesh(new THREE.BoxGeometry(0.12*sz,0.035*sz,0.07*sz),dark); intake.position.set(hL-0.14*sz,yC-0.08*sz,0); g.add(intake); intake.visible=p>=1; }
    parts.prop=pr; parts.props=[pr];

  // 7. roket: tambahan di bawah badan (tidak mengikuti bentuk model)
  if(r>0){
    const rm = r>=10?gold:r>=7?chrome:new THREE.MeshStandardMaterial({color:0xdc2626,roughness:0.4,metalness:0.2});
    const fm=new THREE.MeshBasicMaterial({color:0xffa53a,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false});
    const k=(r>=8?1.5:r>=4?1.25:1)*sz, by=-hb+0.1*k+0.01*sz, bx=-0.1*L;   // sirip roket (turun 0,09·k) tetap di atas tanah
    const slots = r===1?[[0,by]]:r>=5?[[-0.13,by],[0.13,by],[-0.28,by+0.04*sz],[0.28,by+0.04*sz]]:[[-0.12,by],[0.12,by]];
    for(const [zz,y] of slots){ const z=zz*sz;
      const body2=lathe(0.38*k,0.045*k,[[0,.8],[.1,1],[.8,1],[.92,.8],[1,.05]],rm,16); body2.position.set(bx,y,z); g.add(body2);
      if(r>=6){ const cone=new THREE.Mesh(new THREE.ConeGeometry(0.044*k,0.09*k,16),new THREE.MeshStandardMaterial({color:0xef4444})); cone.rotation.z=-Math.PI/2; cone.position.set(bx+0.2*k,y,z); g.add(cone); }
      if(r>=3) for(let i=0;i<4;i++){ const a=i*Math.PI/2; const fin2=new THREE.Mesh(new THREE.BoxGeometry(0.08*k,0.06*k,0.006*k),dark); fin2.position.set(bx-0.15*k,y+Math.cos(a)*0.06*k,z+Math.sin(a)*0.06*k); fin2.rotation.x=a; g.add(fin2); }
      if(r>=9){ const st=new THREE.Mesh(new THREE.CylinderGeometry(0.047*k,0.047*k,0.04*k,16),new THREE.MeshBasicMaterial({color:0xfacc15})); st.rotation.z=Math.PI/2; st.position.set(bx+0.05*k,y,z); g.add(st); }
      const nz=new THREE.Mesh(new THREE.CylinderGeometry(0.03*k,0.04*k,0.05*k,12),dark); nz.rotation.z=Math.PI/2; nz.position.set(bx-0.21*k,y,z); g.add(nz);

}

const UP=new THREE.Vector3(0,1,0), _v=new THREE.Vector3(), _w=new THREE.Vector3();
function between(m,a,b){ _v.subVectors(b,a); const len=_v.length(); m.position.addVectors(a,b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(UP,_v.normalize()); m.scale.set(m.userData.r,len,m.userData.r); }
function buildSling(s){
  const g=new THREE.Group(), l=save.sling, sc=Math.max(1,s.size*0.75)*(1+0.04*(l-1));
  const gold=std(0xfacc15,{metalness:0.8,roughness:0.25});
  const frame = l>=10?gold : l>=6?std(0x64748b,{metalness:0.6,roughness:0.35}) : std(0x8b5a2b);
  const mk=(r,mat)=>{ const m=new THREE.Mesh(GEO.unitCyl,mat); m.userData.r=r; m.castShadow=true; g.add(m); return m; };
  const joint=new THREE.Vector3(0,1.4*sc,0);
  between(mk((l>=6?0.18:0.15)*sc,frame),new THREE.Vector3(0,0,0),joint);
  const tips=[new THREE.Vector3(0,2.4*sc,0.85*sc),new THREE.Vector3(0,2.4*sc,-0.85*sc)];
  tips.forEach(t=>between(mk((l>=6?0.11:0.09)*sc,frame),joint,t));
  const box=(w,h,d,mat,x,y,z)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); m.castShadow=true; g.add(m); return m; };
  if(l>=3) box(1.4*sc,0.15*sc,1.4*sc,l>=7?std(0x374151):std(0x6b4423),0,0.07*sc,0);
  if(l>=5) for(const t of tips){ const ring=new THREE.Mesh(new THREE.TorusGeometry(0.13*sc,0.035*sc,6,14),std(0x9ca3af,{metalness:0.8,roughness:0.3})); ring.position.copy(t).setY(t.y-0.25*sc); ring.rotation.x=Math.PI/2; g.add(ring); }
  if(l>=7) for(const a of [0.55,-0.55]) for(const b of [0.55,-0.55]) box(0.1*sc,0.08*sc,0.1*sc,std(0xd1d5db,{metalness:0.8}),a*sc,0.18*sc,b*sc);
  if(l>=8) for(const z of [0.5,-0.5]) between(mk(0.06*sc,std(0xd1d5db,{metalness:0.9,roughness:0.2})),new THREE.Vector3(-0.5*sc,0.15*sc,z*sc),new THREE.Vector3(0,1.6*sc,z*0.6*sc));
  if(l>=9) for(const t of tips){ const lt=new THREE.Mesh(new THREE.SphereGeometry(0.07*sc,8,6),new THREE.MeshBasicMaterial({color:0x22ff88})); lt.position.copy(t).setY(t.y+0.1*sc); g.add(lt); }
  const rubber=std(l>=4?0x111827:0xd97706,{flatShading:false});
  const br=(l>=2?0.042:0.03)*sc;
  const bands=[mk(br,rubber),mk(br,rubber)];
  if(l>=4){ bands.push(mk(br*0.8,rubber),mk(br*0.8,rubber)); }
  const pouch=new THREE.Mesh(new THREE.BoxGeometry(0.16*sc,0.26*sc,0.34*sc),std(0x3f2a1d)); pouch.castShadow=true; g.add(pouch);
  scene.add(g);
  const tipsAll = l>=4 ? [...tips, tips[0].clone().setY(tips[0].y-0.12*sc), tips[1].clone().setY(tips[1].y-0.12*sc)] : tips;
  return {g,tips:tipsAll,bands,pouch,fork:new THREE.Vector3(0,2.4*sc,0),sc};
}

const PN=700, pPos=new Float32Array(PN*3), pCol=new Float32Array(PN*3), pVel=new Float32Array(PN*3), pLife=new Float32Array(PN), pMax=new Float32Array(PN), pBase=new Float32Array(PN*3);
for(let i=0;i<PN;i++) pPos[i*3+1]=-9999;
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3)); pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const pts=new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.6,map:dotTex,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
pts.frustumCulled=false; scene.add(pts);
let pIdx=0; const _c=new THREE.Color();
function emit(x,y,z,vx,vy,vz,hex,life,n=1,spread=1){
  _c.set(hex);
  for(let k=0;k<n;k++){ const i=pIdx; pIdx=(pIdx+1)%PN;
    pPos[i*3]=x; pPos[i*3+1]=y; pPos[i*3+2]=z;
    pVel[i*3]=vx+rand(-spread,spread); pVel[i*3+1]=vy+rand(-spread,spread); pVel[i*3+2]=vz+rand(-spread,spread);
    pBase[i*3]=_c.r; pBase[i*3+1]=_c.g; pBase[i*3+2]=_c.b; pLife[i]=pMax[i]=life*rand(0.7,1.2); }
}
function updParticles(dt){
  for(let i=0;i<PN;i++){ if(pLife[i]<=0) continue;
    pLife[i]-=dt; const k=Math.max(0,pLife[i]/pMax[i]);
    pPos[i*3]+=pVel[i*3]*dt; pPos[i*3+1]+=pVel[i*3+1]*dt; pPos[i*3+2]+=pVel[i*3+2]*dt;
    pVel[i*3+1]-=1.5*dt;
    pCol[i*3]=pBase[i*3]*k; pCol[i*3+1]=pBase[i*3+1]*k; pCol[i*3+2]=pBase[i*3+2]*k;
    if(pLife[i]<=0) pPos[i*3+1]=-9999; }
  pGeo.attributes.position.needsUpdate=true; pGeo.attributes.color.needsUpdate=true;
}
const TN=180, tPos=new Float32Array(TN*3);

let AC=null, master=null, rocketGain=null, windGain=null, noiseBuf=null;
function audio(){
  if(AC) return AC;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=save.mute?0:0.55; master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const loop=(type,freq,gainNode)=>{ const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; s.connect(f).connect(gainNode).connect(master); s.start(); };
    rocketGain=AC.createGain(); rocketGain.gain.value=0; loop('lowpass',700,rocketGain);
    windGain=AC.createGain(); windGain.gain.value=0; loop('bandpass',900,windGain);
  }catch(e){ AC=null; }
  return AC;
}
function tone(f0,f1,dur,type='sine',vol=0.25){ const a=audio(); if(!a) return; const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(g).connect(master); o.start(t); o.stop(t+dur+0.05); }
function burst(dur,freq,vol){ const a=audio(); if(!a) return; const t=a.currentTime, s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=noiseBuf; f.type='bandpass'; f.frequency.value=freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+dur+0.05); }

// dipanggil setiap frame selama mode orbit (fisika dan jarak berhenti)
const _oC=new THREE.Vector3(), _oL=new THREE.Vector3(), _oW=new THREE.Vector3(), _oO=new THREE.Vector3();
function orbitFrame(dt){
  ORB.t+=dt; decoUpdate(dt);
  const D=orbitDist(), eo=u=>1-Math.pow(1-u,3);
  orbitCam.aspect=camera.aspect; orbitCam.updateProjectionMatrix();
  let inOrb=true, ov=0, dolly=D, chase=0;
  if(ORB.mode==='enter'){
    if(ORB.t<TSW){ inOrb=false; ov=ORB.t/TSW; }
    else { if(!ORB.sw){ ORB.sw=true; toOrbitParent(); }
      const e=eo(Math.min(1,(ORB.t-TSW)/(TIN-TSW))); dolly=D*(2.2-1.2*e); chase=e; ov=1-e; }
    if(ORB.t>=TIN){ ORB.mode='orbit'; ORB.t=0; ov=0; dolly=D; }
  }
  if(ORB.mode==='orbit'){ chase=1;
    ORB.left-=dt; ORB.ang+=dt*Math.PI*2/ORB.dur;
    placeOrbitPlane();
    const left=Math.max(0,Math.ceil(ORB.left));
    if(left!==ORB.lastSec){ ORB.lastSec=left; burstSpark(); const got=Math.floor(flight.orbitBonus*(ORB.dur-left)/ORB.dur); hint((ORB.kind==='sun'?'🔥 <b>ORBIT MATAHARI</b>':'🌍 <b>ORBIT BUMI</b>')+' — sisa '+left+' detik<br>✨ Bonus orbit +'+got+' koin'); }
    if(ORB.left<=0) beginExit();
  }
  if(ORB.mode==='exit'){
    if(ORB.t<TX){ const e=eo(ORB.t/TX); chase=1-e; ov=ORB.t/TX; }
    else { if(!ORB.sw){ ORB.sw=true; toMainParent(); } inOrb=false; ov=1-(ORB.t-TX)/(TOUT-TX); }
    if(ORB.t>=TOUT){ ov=0; finishExit(); }
  }
  if(ORB.on){ plane.flames.forEach(f=>f.visible=false); }
  plane.props.forEach(pr=>{ if(pr.visible) pr.rotation.x+=dt*60; });
  earthMesh.rotation.y+=dt*0.04;
  if(inOrb){
    // kamera mengikuti pesawat dari belakang-atas; bumi berputar di latar belakang
    const ca=Math.cos(ORB.ang), sa=Math.sin(ORB.ang), ct=Math.cos(ORB.tilt), sn=Math.sin(ORB.tilt), pp=plane.group.position;
    _oC.set(pp.x+ca*300+sa*420, pp.y+sa*ct*300-ca*ct*420+120, pp.z+sa*sn*300-ca*sn*420);
    _oW.set(0,dolly*0.0714,dolly);
    orbitCam.position.copy(_oW).lerp(_oC,chase);
    _oO.set(0,0,0); _oL.copy(_oO).lerp(pp,chase);
    orbitCam.lookAt(_oL);
  }
  orbCoin.style.display=ORB.mode==='orbit'?'block':'none';
  if(ORB.mode==='orbit') orbCoin.textContent='🪙 +'+Math.floor(flight.orbitBonus*(ORB.dur-Math.max(0,ORB.left))/ORB.dur).toLocaleString('id-ID');
  warp.style.opacity=Math.max(0,Math.min(1,ov)).toFixed(3);
  renderer.render(inOrb?orbitScene:scene, inOrb?orbitCam:camera);
}

function bounceOff(o){
  let nx=0,nz=0;
  if(o.type==='col'){ const dx=P.x-o.x, dz=P.z-o.z, d=Math.hypot(dx,dz)||1, rr=o.r+st.pr+0.05; nx=dx/d; nz=dz/d; P.x=o.x+nx*rr; P.z=o.z+nz*rr; }
  else if(Math.abs(P.x-o.x)/o.hx > Math.abs(P.z-o.z)/o.hz){ nx=P.x<o.x?-1:1; P.x=o.x+nx*(o.hx+st.pr+0.05); }
  else { nz=P.z<o.z?-1:1; P.z=o.z+nz*(o.hz+st.pr+0.05); }
  const vn=P.vx*nx+P.vz*nz; if(vn<0){ P.vx-=1.5*vn*nx; P.vz-=1.5*vn*nz; }
  P.vy=Math.max(P.vy,3);
  shake=0.3; burst(0.3,160,0.5); tone(600,900,0.25,'triangle',0.2);
  hint('💫 Mantul! (tahan banting)',1500);

function crashInto(o){
  if(CHT.god){ bounceOff(o); return; }

  if(o.type==='col'){ const dx=P.x-o.x, dz=P.z-o.z, d=Math.hypot(dx,dz)||1, rr=o.r+st.pr+0.05; P.x=o.x+dx/d*rr; P.z=o.z+dz/d*rr; }
  else { if(Math.abs(P.x-o.x)/o.hx > Math.abs(P.z-o.z)/o.hz) P.x=o.x+(P.x<o.x?-1:1)*(o.hx+st.pr+0.05); else P.z=o.z+(P.z<o.z?-1:1)*(o.hz+st.pr+0.05); }
  P.vx=-Math.sign(P.vx)*Math.min(4,Math.abs(P.vx)*0.15); P.vz*=0.3; P.vy=Math.min(P.vy,0)-1; P.fuel=0; P.rfuel=0;
  shake=0.6; burst(0.5,220,0.6); tone(200,40,0.5,'sawtooth',0.2);
  emit(P.x,P.y,P.z,0,2,0,0xff7a45,0.9,40,5); emit(P.x,P.y,P.z,0,1,0,0x777777,1.5,30,3);
  $('flash').style.opacity=1; setTimeout(()=>$('flash').style.opacity=0,180);
  hint('💥 Nabrak! Mesin mati — pesawat jatuh. Lain kali belok lebih awal.',3000);
}

canvas.addEventListener('pointerdown',e=>{
  const a=audio(); if(a&&a.state==='suspended') a.resume();
  if(state!=='aim' || aim.active) return;   // jari kedua diabaikan
  aim.active=true; aim.pid=e.pointerId; aim.sx=e.clientX; aim.sy=e.clientY; try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
});
canvas.addEventListener('pointermove',e=>{
  if(state!=='aim'||!aim.active||e.pointerId!==aim.pid) return;
  const dx=e.clientX-aim.sx, dy=e.clientY-aim.sy, len=Math.hypot(dx,dy);
  aim.frac=clamp(len/(0.32*Math.min(innerWidth,innerHeight)),0,anyCheat()?Infinity:1);
  if(len>6){ let ang=Math.atan2(dy,-dx); if(-dx<0) ang = dy>0?1.3:-0.1; setAng(clamp(ang,-0.1,1.3)); }
  restPose(); updateAimInfo(); updatePreview();
});
const pointerEnd=(e,cancel)=>{

};

const JOY_R=70, JOY_RY=40, JOY_DZ=10;   // jarak geser penuh horizontal & vertikal (px) & zona mati

const joyAxis=(v,R=JOY_R)=>{ const a=Math.abs(v); if(a<JOY_DZ) return 0; return clamp(Math.sign(v)*(a-JOY_DZ)/(R-JOY_DZ),-1,1); };
canvas.addEventListener('pointerdown',e=>{

    if(JOY.pid!==-1) return;

});

});

    case 'tahanbanting': CHT.god=!CHT.god; break;

    case 'sampai': if(P.x<curLevel().target-50) P.x=curLevel().target-50; break;

  }

  const onOff={moneyrain:CHT.money,freefly:CHT.free,turboaja:CHT.turbo,tahanbanting:CHT.god,antijatuh:CHT.stall,dewa:CHT.dewa,santai:CHT.santai,gedein:CHT.size===2,kecilin:CHT.size===0.5}[name];

const clock=new THREE.Clock();
function checkHits(){
  const sz=st.size;
  for(const r of rings){ if(r.taken||Math.abs(r.x-P.x)>3) continue;
    if(Math.hypot(r.x-P.x,r.y-P.y,r.z-P.z)<1.2+0.3*sz){ r.taken=true; r.m.visible=false; flight.rings++; const val=Math.round(10*curLevel().plane*st.mult)*(flight.orbitT>0?50:1); flight.ringCoins+=val;
      tone(1200,1900,0.14,'sine',0.2); emit(r.x,r.y,r.z,0,1,0,0xfacc15,0.8,24,4); } }
  if(P.crashed) return;
  for(const o of obstacles){
    if(o.hit) continue;
    if(o.type==='col'){ if(Math.abs(o.x-P.x)>o.r+st.pr+1) continue;
      if(P.y<o.h+st.pr*0.5 && Math.hypot(o.x-P.x,o.z-P.z)<o.r+st.pr){ crashInto(o); return; } }
    else if(o.type==='box'){ if(Math.abs(o.x-P.x)>o.hx+st.pr+1) continue;
      if(P.y<o.h+st.pr*0.5 && Math.abs(o.z-P.z)<o.hz+st.pr && Math.abs(o.x-P.x)<o.hx+st.pr){ crashInto(o); return; } }
    else { if(Math.abs(o.x-P.x)>o.r+st.pr+1) continue;
      if(Math.hypot(o.x-P.x,o.y-P.y,o.z-P.z)<o.r+st.pr){ o.hit=true; flight.hits++;
        const big=!o.bird; P.vx*=big?0.55:0.8; P.vy=P.vy*0.4+(big?2:0.5); P.vz+=(P.z-o.z)*0.5;
        o.m.visible=false; if(o.m2) o.m2.visible=false;
        burst(big?0.2:0.1,big?2500:3200,0.4); emit(o.x,o.y,o.z,0,0,0,big?0xf87171:0x9ca3af,0.7,big?40:12,big?6:3);
        if(big) shake=0.25; } }
  }
}
function frame(){
  requestAnimationFrame(frame);
  try{ frameBody(); }
  catch(e){ console.error('frame error:',e); try{ renderer.render(scene,camera); }catch(_){} }
}
function frameBody(){
  adaptQuality();
  const dt=Math.min(clock.getDelta(),0.05), sz=st.size, now=performance.now()/1000;
  // easter egg: mencapai ORB_ALT (1.200 m) → masuk dimensi orbit (fisika & jarak berhenti)
  if(state==='flight' && !flight.sunDone && Number.isFinite(P.y) && P.y-st.hb>=SUN_ALT && !ORB.mode){ flight.sunDone=true; flight.orbitDone=true; enterOrbit('sun'); }
  if(state==='flight' && !flight.orbitDone && Number.isFinite(P.y) && P.y-st.hb>=ORB_ALT && !ORB.mode){ flight.orbitDone=true; enterOrbit(); }
  if(ORB.mode){ orbitFrame(dt); return; }

  // rintangan bergerak (balon melayang, burung & pesawat melintas) hanya saat terbang
  if(state==='flight'){ for(const o of obstacles){ if(o.vx && !o.hit){ o.x+=o.vx*dt; if(!o.bird){ o.m.position.x=o.x; if(o.m2) o.m2.position.x=o.x; } } } }
  for(const o of obstacles){ if(o.bird && !o.hit){ o.z=o.z0+o.amp*Math.sin(now*0.8+o.ph); o.m.position.set(o.x,o.y+Math.sin(now*3+o.ph)*0.4,o.z); o.m.rotation.y=Math.cos(now*0.8+o.ph)>0?-Math.PI/2:Math.PI/2; o.wg.scale.z=0.6+0.4*Math.abs(Math.sin(now*12+o.ph)); } }

  if(state==='flight'){
    const tu=clamp(((keys.up||btn.up)?1:0)-((keys.down||btn.down)?1:0)+JOY.y,-1,1);
    const tl=clamp(((keys.right||btn.right)?1:0)-((keys.left||btn.left)?1:0)+JOY.x,-1,1);
    inputU+=(tu-inputU)*Math.min(1,dt*6); inputLR+=(tl-inputLR)*Math.min(1,dt*6);
    const rocketOn=keys.rocket||btn.rocket;
    if(CHT.turbo) P.rfuel=st.rBurn;
    acc+=dt*timeScale*(CHT.santai?0.3:1); let impact=0;
    let iters=0;
    while(acc>=H && iters<16){ iters++;
      // langkah adaptif: saat sangat cepat, langkah dibagi kecil agar tidak menembus rintangan / melompat posisi
      const Vn=Math.hypot(P.vx,P.vy,P.vz), rateD=1.225*Vn*st.S*st.cd0/Math.max(0.001,P.m), nSub=Math.min(12,Math.max(1,Math.ceil(Math.max(Vn*H/0.4,rateD*H/0.2))));
      const ui=clamp(inputU*PITCH_GAIN,-1,1), li=clamp(inputLR*LR_GAIN,-1,1);
      for(let j=0;j<nSub;j++){
        stepPhys(P,st,H/nSub,ui,li,rocketOn,flight.t+H*j/nSub);
        impact=Math.max(impact,P.impact);
      }
      checkHits();
      flight.t+=H; acc-=H;
      if(!Number.isFinite(P.x+P.y+P.z+P.vx+P.vy+P.vz)){ P.x=Math.max(0,Number.isFinite(P.x)?P.x:0); P.y=st.hb; P.z=0; P.vx=P.vy=P.vz=0; P.crashed=true; }
      // batas lonjakan ketinggian per langkah: mencegah pemicu orbit terpicu di ketinggian rendah akibat fisika tidak stabil
      if(Number.isFinite(flight.yPrev) && P.y>flight.yPrev+150){ P.y=flight.yPrev+150; P.vy=Math.min(P.vy,0); }
      if(Number.isFinite(P.y)) flight.yPrev=P.y;
      if(!flight.won && P.x>=curLevel().target){ flight.won=true; tone(784,1568,0.4,'square',0.15); emit(P.x,P.y,P.z,0,3,0,0x4ade80,1.2,60,8); hint('🏁 FINISH! Level selesai — terus terbang buat koin tambahan!',3500); }
    }
    if(acc>=H) acc=0;   // kerja fisika per frame dibatasi; sisa waktu dibuang
    if(impact>2.5){ burst(0.25,impact>8?300:600,Math.min(0.5,impact*0.04));
      const water=biomeAt(P.x)===3; emit(P.x,0.2,P.z,P.vx*0.2,2,P.vz*0.2,water?0x93c5fd:0xb8a27a,water?1.2:0.8,Math.min(40,Math.floor(impact*3)),water?3:1.6); }
    const V=Math.hypot(P.vx,P.vy,P.vz);
    flight.maxAlt=Math.max(flight.maxAlt,P.y-st.hb); flight.maxSpd=Math.max(flight.maxSpd,V);
    if(P.onGround && V<0.4) flight.rest+=dt; else flight.rest=0;
    if(P.onGround && flight.t>3) $('bSkip').style.display='inline-block';
    if(flight.rest>0.6 || flight.t>360) endFlight();
    ensureChunks(P.x);
    if(P.burning) for(const f of plane.flames){ _v.copy(f.position); plane.group.localToWorld(_v); emit(_v.x,_v.y,_v.z,P.vx*0.5-camDir.x*8,P.vy*0.5,P.vz*0.5-camDir.z*8,0xff8a2a,0.35,2,1); }
    if(plane.nozzles.length && P.fuel>0 && Math.random()<0.5){ _v.copy(plane.nozzles[(Math.random()*plane.nozzles.length)|0]); plane.group.localToWorld(_v); emit(_v.x,_v.y,_v.z,P.vx*0.6,P.vy*0.6,P.vz*0.6,save.prop>=7?0x3b82f6:0x334155,1.2,1,0.4); }
    if(P.crashed && !P.onGround && Math.random()<0.6) emit(P.x,P.y,P.z,0,1,0,0x555555,1.2,1,0.5);
    tTimer+=dt; if(tTimer>0.03){ tTimer=0; trailPush(P.x,P.y,P.z); }
    if(AC){ rocketGain.gain.value=P.burning?0.35:0; windGain.gain.value=Math.min(0.25,V*V*0.00012); }
  } else if(AC && windGain){ windGain.gain.value*=0.9; rocketGain.gain.value=0; }

  if(state==='landed'){ resultTimer-=dt; if(resultTimer<=0) showResult(); }

  if(state==='flight'||state==='landed'||state==='result'){
    plane.group.position.set(P.x,P.y,P.z);
    const hv=Math.hypot(P.vx,P.vz), yaw=hv>0.3?Math.atan2(-P.vz,P.vx):plane.group.rotation.y;
    const wob = !P.onGround ? (st.L.plane<=2?0.1*wind.gust:0)*Math.sin(flight.t*3.1)+(1-st.yawStab)*0.15*Math.sin(flight.t*2.2) : 0;
    plane.group.rotation.set(P.phi+wob+(P.crashed?flight.t*4:0), yaw, P.theta);
    plane.flames.forEach(f=>{ f.visible=P.burning; const k=rand(0.8,1.3); f.scale.set(k,k*rand(0.9,1.5),k); });
    plane.props.forEach(pr=>{ if(pr.visible) pr.rotation.x+=dt*(P.fuel>0?70:Math.hypot(P.vx,P.vy)*1.5); });
  } else plane.props.forEach(pr=>{ if(pr.visible) pr.rotation.x+=dt*3; });
  if(release.t>=0){
    release.t+=dt; const k=Math.exp(-5*release.t)*Math.cos(28*release.t);
    sling.pouch.position.lerpVectors(sling.fork,release.from,k); updBands();
    if(release.t>2) release.t=-1;
  }
  for(const r of rings) if(!r.taken) r.m.rotation.y=now*2.5;
  const cx=camera.position.x;
  for(const t of thermals){ if(Math.abs(t.x-cx)>400) continue; const a=t.pts.geometry.attributes.position;
    for(let k=0;k<t.N;k++){ let y=a.array[k*3+1]+t.w*dt*1.5; if(y>t.top) y=0; a.array[k*3+1]=y; } a.needsUpdate=true; }
  updParticles(dt);

  const pp=plane.group.position;
  if(state==='garage'){
    orbit+=dt*0.3; const R=(st.L.plane===5?2.8:2.3)*sz+1.0;
    camera.position.set(pp.x+Math.cos(orbit)*R, pp.y+0.7*sz+0.4, Math.sin(orbit)*R);
    camLook.set(pp.x,pp.y,0);
  } else if(state==='aim'){
    const want=_v.set(-2.5-1.2*sz-aim.frac*1.5, 2.6+1.0*sz+aim.frac*1.2, 5+3.2*sz+aim.frac*3);
    camera.position.lerp(want,1-Math.exp(-4*dt));
    camLook.lerp(_w.set(3+1.5*sz+aim.frac*5,2.2+sz*0.6+aim.frac*1.5,0),1-Math.exp(-4*dt));
  } else {
    const hv=Math.hypot(P.vx,P.vz);
    if(hv>1) camDir.lerp(_w.set(P.vx/hv,0,P.vz/hv),1-Math.exp(-2.5*dt)).normalize();
    const V=Math.hypot(P.vx,P.vy,P.vz), back=4*sz+4+Math.min(V,anyCheat()?600:80)*0.05;
    const want=_v.set(P.x-camDir.x*back-camDir.z*1.2*sz, Math.max(1.2,P.y+1.3*sz+1.4), P.z-camDir.z*back+camDir.x*1.2*sz);
    camera.position.lerp(want,1-Math.exp(-(state==='flight'?3.5:2)*dt));
    camLook.lerp(_w.set(P.x+camDir.x*(6+V*0.12),P.y+0.4*sz,P.z+camDir.z*(6+V*0.12)),1-Math.exp(-5*dt));
  }
  if(shake>0){ shake=Math.max(0,shake-dt); camera.position.x+=rand(-1,1)*shake; camera.position.y+=rand(-1,1)*shake; }
  camera.lookAt(camLook);
  sky.position.copy(camera.position);
  updateSky((state==='flight'||state==='landed'||state==='result')?Math.max(0,P.y-st.hb):0);
  scene.fog.far=850;
  placeSun(pp.x,Math.min(pp.y,60),pp.z);
  if(state!=='garage') updateHud();
  renderer.render(scene,camera);
}

/* ================= START ================= */
loadAssets().then(()=>{ rebuildModels(); resetWorld(); openGarage(); $('loading').style.display='none'; frame(); });
</script>

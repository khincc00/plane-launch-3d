<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Plane Launch 3D</title>
<meta name="description" content="Game ketapel pesawat 3D berbasis web dengan fisika terbang realistis. Tanpa iklan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060b18; --panel:rgba(8,16,34,.94); --line:rgba(125,211,252,.2);
  --text:#f2f7ff; --muted:#a7b8d4; --sky:#38bdf8; --yellow:#facc15; --green:#4ade80; --red:#fb7185;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#c:active{cursor:grabbing}
.mono{font-family:'JetBrains Mono',monospace}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:disabled{opacity:.45;cursor:not-allowed}

#hud{position:fixed;left:0;right:0;top:0;padding:12px 16px;pointer-events:none;display:none}
.hud-row{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:rgba(6,11,24,.62);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:7px 12px;min-width:86px}
.stat span{display:block;font-size:10px;letter-spacing:.16em;color:var(--muted)}
.stat b{font-family:'Sora',sans-serif;font-size:18px;font-weight:800}
.stat.big b{font-size:24px;color:var(--yellow)}
.stat.coin b{color:var(--yellow)}
.hud-sub{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.chip{background:rgba(6,11,24,.6);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.prog{margin-top:8px;max-width:420px;background:rgba(6,11,24,.6);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:11px;letter-spacing:.08em}
.prog i{display:block;margin-top:4px;height:7px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--green));border-radius:9px}
.bars{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-width:240px}
.bar{font-size:10px;letter-spacing:.14em;color:var(--muted)}
.bar i{display:block;margin-top:3px;height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i u{display:block;height:100%;width:100%;border-radius:9px}

#topBtns{position:fixed;top:12px;right:16px;display:none;gap:8px;z-index:5;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.round{background:rgba(6,11,24,.7);border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:13px;font-weight:700;backdrop-filter:blur(8px)}

#aimInfo{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);display:none;gap:10px;pointer-events:none}
#aimInfo .stat{text-align:center}
#hint{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);text-align:center;background:rgba(6,11,24,.72);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:13px;pointer-events:none;display:none;transition:opacity .4s}
#flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(255,80,60,0) 40%,rgba(255,60,40,.55));opacity:0;transition:opacity .5s}

.pad{position:fixed;bottom:24px;display:none;gap:10px;z-index:4;align-items:flex-end}
#padL{left:16px}#padR{right:16px}
.pad .col{display:flex;flex-direction:column;gap:10px}
.pad button{width:64px;height:64px;border-radius:20px;background:rgba(6,11,24,.7);border:1px solid var(--line);font-size:22px;font-weight:800;backdrop-filter:blur(8px);touch-action:none;user-select:none;-webkit-user-select:none}
.pad button.on{background:var(--yellow);color:#111}
#bRocket{width:78px;height:78px;font-size:30px}

.overlay{position:fixed;z-index:10;display:none}
#garage{right:0;top:0;bottom:0;width:min(480px,100%);background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:20px 18px 110px;backdrop-filter:blur(14px)}
#garage .head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;gap:10px;align-items:center}
.logo .ic{width:40px;height:40px;border-radius:12px;background:var(--yellow);color:#111;display:grid;place-items:center;font-size:20px}
.logo b{display:block;font-family:'Sora';font-size:17px;letter-spacing:-.01em}
.logo span{font-size:10px;letter-spacing:.18em;color:var(--sky)}
.wallet{background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.35);color:var(--yellow);border-radius:999px;padding:8px 13px;font-family:'Sora';font-weight:800;white-space:nowrap}
.sec{margin-top:20px}
.kick{font-size:11px;letter-spacing:.2em;color:var(--yellow);font-weight:700;display:flex;align-items:center;gap:8px}
.kick:before{content:"";width:22px;height:1px;background:var(--yellow)}
.lvcard{margin-top:12px;border:1px solid rgba(250,204,21,.45);border-radius:20px;padding:15px;background:linear-gradient(145deg,rgba(250,204,21,.12),rgba(56,189,248,.06))}
.lvcard .top{display:flex;gap:12px;align-items:center}
.lvcard .em{font-size:44px;line-height:1}
.lvcard small{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--sky)}
.lvcard h3{margin:2px 0 0;font-family:'Sora';font-size:19px;line-height:1.15}
.lvcard p{margin:4px 0 0;font-size:12.5px;color:#cbd8ee}
.road{display:flex;gap:5px;margin-top:12px}
.road span{flex:1;text-align:center;border-radius:10px;padding:6px 0;font-size:18px;background:rgba(255,255,255,.05);border:1px solid transparent}
.road span.done{background:rgba(74,222,128,.15);border-color:rgba(74,222,128,.4)}
.road span.cur{background:rgba(250,204,21,.18);border-color:var(--yellow)}
.road span.lock{opacity:.35}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:11.5px}
.chips span{border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:#cbd8ee}
.btn{border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;background:#fff;color:#111}
.btn.y{background:var(--yellow)}
.tag{display:inline-block;text-align:center;border-radius:999px;padding:7px 10px;font-size:11.5px;font-weight:800}
.tag.on{background:var(--yellow);color:#111}
.ups{display:grid;gap:10px;margin-top:12px}
.up{border:1px solid var(--line);border-radius:18px;padding:13px;background:rgba(255,255,255,.035)}
.up.keep{border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.06)}
.up .t{display:flex;align-items:center;justify-content:space-between;gap:10px}
.up h4{margin:0;font-family:'Sora';font-size:15px}
.up p{margin:6px 0 4px;font-size:12px;color:var(--muted);line-height:1.45}
.up .nx{margin:0 0 9px;font-size:12px;color:#fde68a}
.lv{display:flex;gap:3px}
.lv i{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.1)}
.lv i.f{background:var(--yellow)}
.lvt{font-size:10.5px;color:var(--muted);margin-top:5px;letter-spacing:.08em}
.note{margin-top:10px;font-size:12px;color:#fde68a;line-height:1.5}
.statsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sg{border-radius:14px;background:rgba(255,255,255,.04);padding:9px 11px}
.sg span{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted)}
.sg b{font-family:'JetBrains Mono';font-size:14px}
.phys{margin-top:12px;font-size:12.5px;line-height:1.55;color:#cbd8ee;border-radius:16px;border:1px solid var(--line);padding:12px 14px;background:rgba(56,189,248,.06)}
.phys b{color:#fff}
.warn{margin-top:8px;font-size:12px;color:#fca5a5;line-height:1.5}
.noads{margin-top:14px;font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.noads span{border:1px solid rgba(251,113,133,.35);color:#fecdd3;border-radius:999px;padding:4px 9px}
.go{position:fixed;right:18px;bottom:18px;width:min(444px,calc(100% - 36px));padding:16px;border-radius:18px;background:var(--yellow);color:#111;font-family:'Sora';font-weight:800;font-size:17px;z-index:11;display:none;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.reset{margin-top:18px;background:none;color:var(--muted);font-size:12px;text-decoration:underline}

#result{left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,calc(100% - 32px));max-height:calc(100% - 32px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#result h2{margin:6px 0 2px;font-family:'Sora';font-size:26px}
#result .dist{font-family:'Sora';font-size:46px;font-weight:800;color:var(--yellow);line-height:1.05;margin-top:8px}
#result .rows{margin:16px 0;display:grid;gap:6px;text-align:left}
#result .rows div{display:flex;justify-content:space-between;gap:10px;background:rgba(255,255,255,.04);border-radius:12px;padding:8px 12px;font-size:13.5px}
#result .earn{font-family:'Sora';font-size:22px;font-weight:800;color:var(--yellow)}
#result .acts{display:flex;gap:10px;margin-top:16px}
#result .acts button{flex:1;padding:13px;border-radius:999px;font-weight:800}
.rec{display:inline-block;background:var(--green);color:#052e16;font-weight:800;font-size:11px;letter-spacing:.14em;border-radius:999px;padding:5px 10px}
.win{border:1px solid rgba(74,222,128,.5);background:rgba(74,222,128,.1);border-radius:16px;padding:12px;margin-top:12px;font-size:13px;line-height:1.5}
.win b{color:var(--green)}
.miss{color:#fca5a5;font-weight:700;margin-top:6px;font-size:14px}
.tip{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}

#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;font-family:'Sora';font-size:15px;color:var(--muted)}

@media (max-width:760px){
  #garage{top:auto;height:66vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:24px 24px 0 0}
  .go{right:16px;width:calc(100% - 32px)}
  .stat{min-width:0;padding:6px 10px}
  .stat b{font-size:15px}.stat.big b{font-size:19px}
  #hint{bottom:104px;font-size:12px}
  #aimInfo{bottom:150px}
  .pad button{width:58px;height:58px}
  #bRocket{width:68px;height:68px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="loading">Menyiapkan landasan…</div>

<div id="hud">
  <div class="hud-row">
    <div class="stat big"><span>JARAK</span><b id="hDist">0 m</b></div>
    <div class="stat"><span>TINGGI</span><b id="hAlt">0 m</b></div>
    <div class="stat"><span>KECEPATAN</span><b id="hSpd">0</b></div>
    <div class="stat coin"><span>KOIN</span><b id="hCoins">0</b></div>
  </div>
  <div class="prog"><span id="hLevel">LEVEL 1</span><i><u id="uProg"></u></i></div>
  <div class="hud-sub"><span class="chip" id="hWind"></span><span class="chip" id="hBiome"></span><span class="chip" id="hStall" style="display:none;background:#b91c1c;border-color:#fb7185">⚠ STALL</span></div>
  <div class="bars">
    <div class="bar" id="barEng">MESIN<i><u id="uEng" style="background:var(--sky)"></u></i></div>
    <div class="bar" id="barRkt">ROKET<i><u id="uRkt" style="background:#f97316"></u></i></div>
  </div>
</div>

<div id="topBtns">
  <button class="round" id="bFast" style="display:none">⏩ 1×</button>
  <button class="round" id="bSkip" style="display:none">⏭ Selesai</button>
  <button class="round" id="btnMute">🔊</button>
  <button class="round" id="btnGarage">🔧 Garasi</button>
</div>

<div id="aimInfo"><div class="stat"><span>TARIKAN</span><b id="aPow">0%</b></div><div class="stat"><span>SUDUT</span><b id="aAng">0°</b></div><div class="stat"><span>LAJU LEPAS</span><b id="aSpd">0</b></div></div>
<div id="hint"></div>

<div class="pad" id="padL"><button id="bLeft" aria-label="Belok kiri">◀</button><button id="bRight" aria-label="Belok kanan">▶</button></div>
<div class="pad" id="padR">
  <div class="col"><button id="bUp" aria-label="Hidung naik">▲</button><button id="bDown" aria-label="Hidung turun">▼</button></div>
  <button id="bRocket" aria-label="Roket">🚀</button>
</div>

<div id="garage" class="overlay"></div>
<button class="go" id="btnGo">▶ KE KETAPEL</button>
<div id="result" class="overlay"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ================= UTIL ================= */
const $ = id => document.getElementById(id);
const fmt = n => Math.floor(n).toLocaleString('id-ID');
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const smooth = (a,b,x) => { const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const wrap = a => { while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; };
const rand = (a,b) => a+Math.random()*(b-a);
const G = 9.81;

/* ================= SAVE ================= */
const SAVE_KEY = 'planeLaunch3d.v2';
const DEF = {coins:0,level:1,cleared:0,wing:1,sling:1,prop:0,rocket:0,bonus:1,best:[0,0,0,0,0,0,0],flights:0,total:0,mute:false};
function loadSave(){ try{ const r=localStorage.getItem(SAVE_KEY); if(r){ const s={...DEF,...JSON.parse(r)}; if(!Array.isArray(s.best)||s.best.length!==7) s.best=[...DEF.best]; return s; } }catch(e){} return {...DEF,best:[...DEF.best]}; }
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
let save = loadSave();

/* ================= DATA PESAWAT, LEVEL & UPGRADE ================= */
const BODIES = [
  {name:'Pesawat Kertas',   emoji:'✈️', mass:0.9, cd0:0.050, area:0.24, ar:4.0, thrust:0,  fuel:0,  size:1.0, color:0xf8fafc, wheels:false},
  {name:'Pesawat Kardus',   emoji:'📦', mass:1.1, cd0:0.040, area:0.26, ar:5.2, thrust:0,  fuel:0,  size:1.25,color:0xc8a165, wheels:false},
  {name:'Mainan Kayu',      emoji:'🪵', mass:1.6, cd0:0.034, area:0.26, ar:6.0, thrust:6,  fuel:5,  size:1.5, color:0xb7793f, wheels:false},
  {name:'Mainan RC',        emoji:'🎮', mass:2.2, cd0:0.030, area:0.24, ar:7.0, thrust:10, fuel:8,  size:1.7, color:0xef4444, wheels:true},
  {name:'Ultralight',       emoji:'🦋', mass:3.0, cd0:0.026, area:0.30, ar:10,  thrust:13, fuel:10, size:2.1, color:0x22c55e, wheels:true},
  {name:'Pesawat Propeller',emoji:'🛩️', mass:4.4, cd0:0.023, area:0.26, ar:8.5, thrust:24, fuel:10, size:2.5, color:0x38bdf8, wheels:true},
  {name:'Jet Penumpang',    emoji:'🛫', mass:6.5, cd0:0.019, area:0.22, ar:9.0, thrust:50, fuel:12, size:3.2, color:0xe5e7eb, wheels:true},
];
const LEVELS = [
  {plane:1, target:500,  biomes:[0],       obst:0.6, alt:30,  wind:2.0, pf:1,   name:'Lapangan Latihan'},
  {plane:2, target:900,  biomes:[0,1],     obst:0.8, alt:40,  wind:2.5, pf:3,   name:'Lembah Berangin'},
  {plane:3, target:1300, biomes:[1],       obst:1.0, alt:55,  wind:3.0, pf:8,   name:'Canyon Merah'},
  {plane:4, target:2000, biomes:[1,2],     obst:1.1, alt:80,  wind:3.0, pf:14,  name:'Pinggiran Kota'},
  {plane:5, target:2200, biomes:[2,3],     obst:1.2, alt:100, wind:3.5, pf:30,  name:'Pelabuhan'},
  {plane:6, target:2000, biomes:[3,2],     obst:1.3, alt:120, wind:4.0, pf:60,  name:'Teluk Metropolitan'},
  {plane:7, target:2800, biomes:[0,1,2,3], obst:1.5, alt:150, wind:4.5, pf:120, name:'Lintas Benua'},
];
const curLevel = () => LEVELS[save.level-1];
const round10 = n => n<1000 ? Math.round(n/10)*10 : Math.round(n/50)*50;
const PRICE = {
  wing:   l => round10(60*Math.pow(1.6,l-1)*curLevel().pf),
  sling:  l => round10(60*Math.pow(1.6,l-1)*curLevel().pf),
  prop:   l => round10(90*Math.pow(1.6,l)*curLevel().pf),
  rocket: l => round10(150*Math.pow(1.6,l)*curLevel().pf),
  bonus:  l => round10(150*Math.pow(1.45,l-1)),
};
// Bagian fisik yang bertambah tiap level upgrade (level ke-n = bagian ke-n)
const PARTS = {
  wing:  ['Bodi saja','Sayap kiri','Sayap kanan','Ekor belakang (stabilizer)','Sirip tegak','Winglet di ujung sayap','Flap & aileron','Sayap lebih panjang','Canard depan','Trim emas & lampu navigasi'],
  prop:  ['Tanpa mesin (bodi saja)','Baling-baling 2 bilah','Spinner (kerucut hidung)','Baling-baling 3 bilah','Cowling mesin','Knalpot ganda','Baling-baling 4 bilah besar','Saluran udara (intake)','Baling-baling 5 bilah','Bilah emas','Mesin turbo emas'],
  jet:   ['Tanpa mesin (bodi saja)','2 mesin jet kecil','Mesin lebih besar','Pylon aerodinamis','Cincin afterburner','Casing krom','4 mesin jet','Nozzle vektor','Afterburner biru','Pylon karbon','Mesin emas'],
  rocket:['Tanpa roket','1 booster tengah','2 booster','2 booster + sirip','Booster lebih besar','4 booster','Ujung kerucut merah','Nozzle krom','Booster jumbo','Garis api','Booster emas'],
  sling: ['Ketapel kayu','Karet lebih tebal','Alas kayu','Karet ganda hitam','Ring baja','Rangka besi','Alas berbaut','Piston hidrolik','Lampu bidik','Ketapel emas'],
};
const BIOMES = [
  {name:'🌱 Lapangan Rumput', mu:0.50, color:0x5fae4e},
  {name:'🏜️ Canyon',          mu:0.60, color:0xd9a066},
  {name:'🏙️ Kota',            mu:0.40, color:0x6b7280},
  {name:'🌊 Laut',             mu:1.80, color:0x2b7bb9},
];
function biomeAt(x){ const L=curLevel(), n=L.biomes.length; return L.biomes[clamp(Math.floor(x/L.target*n),0,n-1)]; }
const coinMult = () => (1+0.3*(save.bonus-1))*Math.pow(2,save.cleared);
const WING_AREA=[0.22,0.55,1.0,1.06,1.12,1.22,1.32,1.45,1.6,1.78];

function stats(){
  const L=curLevel(), B=BODIES[L.plane-1], w=save.wing, l=save.sling-1, r=save.rocket, p=save.prop;
  const S = B.area*WING_AREA[w-1];
  const AR = B.ar*(w<=2?0.5:1)+0.35*Math.max(0,w-3);
  const cd0 = B.cd0*(1-0.02*(w-1))*(w<4?1.25:1);
  const E = Math.max(B.thrust, 2.2*B.mass);              // tenaga mesin penuh (level 10)
  const thrust = p>0 ? E*(0.3+0.07*p) : 0;
  const fuel = p>0 ? (B.fuel||4)*(0.4+0.06*p) : 0;
  const rThrust = r>0 ? 10*(1+0.2*(r-1))*Math.sqrt(B.mass) : 0;
  const rBurn = r>0 ? 1+0.25*r : 0;
  const rFuelMass = r>0 ? 0.02*rBurn*Math.sqrt(B.mass) : 0;
  const rDry = r>0 ? (0.1+0.02*r)*Math.sqrt(B.mass) : 0;
  const mass = B.mass*(1+0.02*(w-1)) + rDry + rFuelMass + 0.03*p*B.mass;
  const CLA = 2*Math.PI*AR/(AR+2);
  const clBest = Math.sqrt(cd0*Math.PI*0.82*AR);
  return {
    L, B, S, AR, cd0, mass, CLA, CL0:0.18, aStall:0.24, e:0.82, aBest:Math.min(0.2,(clBest-0.18)/CLA),
    k: 650*Math.pow(1.3,l), maxX: 1.3+0.09*l, eff: 0.62+0.02*l,
    thrust, fuel, rThrust, rBurn, rFuelMass,
    stab: w>=4?1:0.4,        // tanpa ekor: pitch tidak stabil
    yawStab: w>=5?1:0.4,     // tanpa sirip tegak: melenceng ke samping
    asym: w===2?1:0,         // cuma sayap kiri: pesawat cenderung miring kanan
    mult: coinMult(), size:B.size, hb:(B.wheels?0.2:0.12)*B.size, pr:0.35*B.size,
    muMul: B.wheels?0.3:1,
  };
}

  } else if(b===2){

    for(let d=0;d<CH;d+=10) add(GEO.bld,MAT.stripe,x0+d+2.5,0.01,0,5,0.04,0.35);

  } else {

      } else if(b===1){
        const r=rand(3,6), h=rand(20,Math.max(40,L.alt*1.4)); add(GEO.mesa,MAT.mesa[k%3],x,0,z,r,h,r,rand(0,3)); solid({type:'col',x,z,r:r*1.1,h});
      } else if(b===2){
        const hx=rand(3,6), hz=rand(3,6), h=rand(20,Math.max(40,L.alt*1.5)); add(GEO.bld,MAT.bld[k%6],x,0,z,hx*2,h,hz*2);

    if(Math.random()<0.35*L.obst){
      const bx=x0+rand(10,90), by=rand(8,L.alt*1.2), bz=rand(-LANE,LANE);

      const m=add(GEO.ring,MAT.ring,x,y,z,1); m.rotation.y=Math.PI/2;
      items.rings.push({x,y,z,m,taken:false}); }
  }
  if(x0>=60 && Math.random()<0.4){
    const x=x0+rand(15,85), z=rand(-LANE,LANE), r=rand(9,16), w=rand(2.5,5.5)*(b===3?1.3:1), top=rand(50,170);

    for(let k=0;k<N;k++){ const a=rand(0,6.28), rr=Math.sqrt(Math.random())*r*0.9; pos[k*3]=x+Math.cos(a)*rr; pos[k*3+1]=rand(0,top); pos[k*3+2]=z+Math.sin(a)*rr; }
    const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));

    grp.add(pts); items.thermals.push({x,z,r,w,top,pts,N});

  chunks.set(i,{grp,items});
}
function dropChunk(i){
  const c=chunks.get(i); if(!c) return;
  scene.remove(c.grp);
  c.items.thermals.forEach(t=>{ t.pts.geometry.dispose(); t.pts.material.dispose(); });
  rings=rings.filter(r=>!c.items.rings.includes(r));
  obstacles=obstacles.filter(r=>!c.items.obstacles.includes(r));
  thermals=thermals.filter(r=>!c.items.thermals.includes(r));
  chunks.delete(i);
}
function ensureChunks(x){
  const a=Math.floor((x-200)/CH), b=Math.floor((x+800)/CH);
  for(let i=a;i<=b;i++) if(!chunks.has(i)) makeChunk(i);
  for(const i of [...chunks.keys()]) if(i<a-1||i>b+1) dropChunk(i);
}
function resetWorld(){ for(const i of [...chunks.keys()]) dropChunk(i); ensureChunks(0); finish.position.x=curLevel().target; placeBest(); }

/* ================= ANGIN & THERMAL ================= */
const wind={base:0,cross:0,gust:1,ph:0};
const air=[0,0,0];
function airAt(x,y,z,t){
  const g=Math.sin(t*0.9+wind.ph)*Math.sin(t*0.37+1.3);
  air[0]=wind.base+wind.gust*g;
  air[1]=0.25*wind.gust*Math.sin(t*1.3+wind.ph*2);
  air[2]=wind.cross+0.6*wind.gust*Math.sin(t*0.53+wind.ph);
  for(const th of thermals){ const dx=x-th.x, dz=z-th.z, d2=dx*dx+dz*dz;
    if(d2<th.r*th.r && y<th.top) air[1]+=th.w*(1-d2/(th.r*th.r))*Math.min(1,(th.top-y)/20); }
  return air;
}

/* ================= FISIKA TERBANG (3D) =================
   Gravitasi, lift ½ρv²S·CL (ikut miring saat bank → belok), drag CD0 + CL²/πeAR,
   stall > 14°, angin depan/samping + hembusan + thermal, ρ turun dengan ketinggian,
   bagian pesawat yang belum terpasang (ekor/sirip/sayap) bikin tidak stabil. */
function liftCoef(a,s){
  const lin=s.CL0+s.CLA*clamp(a,-s.aStall,s.aStall);
  const f=smooth(s.aStall,s.aStall+0.18,Math.abs(a));
  return lin*(1-f)+0.95*Math.sin(2*a)*f;
}
function stepPhys(p,s,dt,u,lr,rocketOn,t){
  const A=airAt(p.x,p.y,p.z,t);
  const vrx=p.vx-A[0], vry=p.vy-A[1], vrz=p.vz-A[2];
  const V=Math.hypot(vrx,vry,vrz)+1e-6, ux=vrx/V, uy=vry/V, uz=vrz/V;
  const gam=Math.asin(clamp(uy,-1,1));
  const phiT = p.onGround||p.crashed ? 0 : lr*0.5 + s.asym*0.25;
  p.phi+=(phiT-p.phi)*(1-Math.exp(-3*dt));
  const cphi=Math.cos(p.phi), sphi=Math.sin(p.phi);
  const rho=1.225*Math.exp(-Math.max(0,p.y)/8500);
  const q=0.5*rho*V*V;
  if(p.crashed) u=-0.3;
  const nT=(Math.cos(gam)-0.4*Math.sin(gam))/Math.max(0.5,cphi)+1.6*u;
  const aN=(nT*p.m*G/(q*s.S+1e-6)-s.CL0)/s.CLA;
  const aBest=s.aBest+Math.max(0,u)*0.3+Math.min(0,u)*0.1;
  let aCmd=clamp(Math.min(aN,aBest),-0.14,s.aStall*0.92+Math.max(0,u)*0.25);
  if(s.stab<1) aCmd+=(1-s.stab)*0.12*Math.sin(t*2.3+1.1)*Math.sin(t*0.7);   // tanpa ekor: mengangguk-angguk
  const rate=(1.2+9*Math.min(1,V/12))*s.stab;
  const thT = p.onGround ? clamp(aCmd,0.02,0.2) : gam+aCmd;
  p.theta+=wrap(thT-p.theta)*(1-Math.exp(-(p.onGround?6:rate)*dt));
  const a=wrap(p.theta-gam); p.alpha=a;
  const cl=liftCoef(a,s)*(p.crashed?0.4:1), f=smooth(s.aStall,s.aStall+0.18,Math.abs(a));
  const cd=s.cd0*(p.crashed?3:1)+(cl*cl/(Math.PI*s.e*s.AR))*(1-f)+1.28*Math.sin(a)**2*f;
  const L=q*s.S*cl, D=q*s.S*cd;
  let upx=-uy*ux, upy=1-uy*uy, upz=-uy*uz; const ul=Math.hypot(upx,upy,upz)||1; upx/=ul; upy/=ul; upz/=ul;
  const sx=uy*upz-uz*upy, sy=uz*upx-ux*upz, sz=ux*upy-uy*upx;
  const lx=upx*cphi+sx*sphi, ly=upy*cphi+sy*sphi, lz=upz*cphi+sz*sphi;
  let fx=-D*ux+L*lx, fy=-D*uy+L*ly, fz=-D*uz+L*lz, T=0;
  if(s.yawStab<1 && !p.onGround) fz+=(1-s.yawStab)*q*s.S*0.12*Math.sin(t*1.7+0.4);   // tanpa sirip tegak: melenceng
  if(p.fuel>0 && !p.crashed){ T+=s.thrust; p.fuel-=dt; }
  p.burning=false;
  if(rocketOn && p.rfuel>0 && !p.crashed){ T+=s.rThrust; p.rfuel-=dt; p.m-=s.rFuelMass/s.rBurn*dt; p.burning=true; }
  const hv=Math.hypot(p.vx,p.vz), hx=hv>0.1?p.vx/hv:1, hz=hv>0.1?p.vz/hv:0;
  fx+=T*Math.cos(p.theta)*hx; fz+=T*Math.cos(p.theta)*hz; fy+=T*Math.sin(p.theta)-p.m*G;
  p.vx+=fx/p.m*dt; p.vy+=fy/p.m*dt; p.vz+=fz/p.m*dt;
  p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
  p.impact=0;
  if(p.y<=s.hb){
    p.y=s.hb;
    if(p.vy<0){ const imp=-p.vy; p.impact=imp; if(imp>2.5){ p.vy=imp*0.25; p.vx*=0.88; p.vz*=0.88; } else p.vy=0; }
    const bi=biomeAt(p.x), mu=BIOMES[bi].mu*(bi===3?1:s.muMul)*(p.crashed?2.5:1);
    const N=Math.max(0,p.m*G-Math.max(0,L*ly));
    const dec=mu*N/p.m*dt, hs=Math.hypot(p.vx,p.vz);
    if(hs<=dec){ p.vx=0; p.vz=0; } else { const k=(hs-dec)/hs; p.vx*=k; p.vz*=k; }
    p.onGround=true;
  } else if(p.y>s.hb+0.05) p.onGround=false;
}

function canvasTex(key,w,h,draw){

let AC=null, master=null, rocketGain=null, windGain=null, noiseBuf=null;
function audio(){
  if(AC) return AC;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=save.mute?0:0.55; master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const loop=(type,freq,gainNode)=>{ const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; s.connect(f).connect(gainNode).connect(master); s.start(); };
    rocketGain=AC.createGain(); rocketGain.gain.value=0; loop('lowpass',700,rocketGain);
    windGain=AC.createGain(); windGain.gain.value=0; loop('bandpass',900,windGain);

}

  s.buffer=noiseBuf; f.type='bandpass'; f.frequency.value=freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+dur+0.05); }

  else if(save.wing<5) warns.push('Belum ada sirip tegak — pesawat melenceng ke samping.');
  $('garage').innerHTML=`
    <div class="head"><div class="logo"><div class="ic">✈</div><div><b>PLANE LAUNCH 3D</b><span>FISIKA NYATA • TANPA IKLAN</span></div></div><div class="wallet">${fmt(c)} 🪙</div></div>
    <div class="lvcard">
      <div class="top"><div class="em">${B.emoji}</div><div><small>LEVEL ${save.level} / ${LEVELS.length}</small><h3>${L.name}</h3><p>Pesawat: <b>${B.name}</b> • Finish <b>${fmt(L.target)} m</b></p></div></div>
      <div class="road">${LEVELS.map((lv,i)=>`<span class="${i+1<save.level?'done':i+1===save.level?'cur':'lock'}" title="Level ${i+1}">${BODIES[lv.plane-1].emoji}</span>`).join('')}</div>
      <div class="chips">${L.biomes.map(b=>`<span>${BIOMES[b].name}</span>`).join('')}<span>💨 Angin s/d ${L.wind} m/s</span><span>🏁 Rekor: ${fmt(best)} m</span><span>🪙 Bonus ×${fmt(coinMult()*10)/10}</span></div>
    </div>
    <div class="sec"><div class="kick">UPGRADE PESAWAT</div>
      <div class="note">⚠ Upgrade ini <b>reset ke awal</b> (bodi saja) setiap pindah level. Tiap upgrade menambah bagian fisik baru.</div>
      ${warns.map(w=>`<div class="warn">• ${w}</div>`).join('')}
      <div class="ups">${ups.map(u=>{ const maxed=u.l>=u.max, price=PRICE[u.k](save[u.k]);
        return `<div class="up"><div class="t"><h4>${u.ic} ${u.n}</h4>${maxed?'<span class="tag on">MAX</span>':`<button class="btn y" data-k="${u.k}" ${c<price?'disabled':''}>Upgrade ${fmt(price)} 🪙</button>`}</div>
        <p>Sekarang: <b style="color:#fff">${u.now}</b></p>${maxed?'':`<div class="nx">Berikutnya: + ${u.next}</div>`}${lvBar(u.l,u.max)}<div class="lvt mono">LEVEL ${u.l} / ${u.max}</div></div>`; }).join('')}
      <div class="up keep"><div class="t"><h4>🪙 Bonus Koin</h4><button class="btn y" data-k="bonus" ${c<PRICE.bonus(save.bonus)?'disabled':''}>Upgrade ${fmt(PRICE.bonus(save.bonus))} 🪙</button></div>
        <p>Pengali koin per meter +0,3 tiap level. <b>Tanpa batas</b> & <b>tidak reset</b>. Tiap map selesai, total bonus dikali 2.</p>
        <div class="lvt mono">LEVEL ${save.bonus} • ∞ • TOTAL ×${fmt(coinMult()*10)/10}</div></div>
      </div></div>
    <div class="sec"><div class="kick">DATA FISIKA PESAWAT</div><div class="statsgrid">
      <div class="sg"><span>MASSA</span><b>${s.mass.toFixed(2)} kg</b></div>
      <div class="sg"><span>LUAS SAYAP</span><b>${s.S.toFixed(2)} m²</b></div>
      <div class="sg"><span>RASIO LUNCUR MAKS</span><b>${ldMax(s).toFixed(1)} : 1</b></div>
      <div class="sg"><span>LAJU LEPAS MAKS</span><b>${fmt(launchSpeed(s,1)*3.6)} km/j</b></div>
      <div class="sg"><span>MESIN</span><b>${s.thrust?`${s.thrust.toFixed(1)} N · ${s.fuel.toFixed(1)} s`:'—'}</b></div>
      <div class="sg"><span>ROKET</span><b>${s.rThrust?`${fmt(s.rThrust)} N · ${s.rBurn.toFixed(1)} s`:'—'}</b></div>
    </div>
    <div class="phys"><b>Fisika tiap 1/240 detik:</b> gravitasi, gaya angkat (½ρv²·S·C<sub>L</sub>) yang ikut miring saat belok, hambatan parasit + induksi, <b>stall</b> di sudut serang &gt; 14°, angin depan/samping & hembusan, <b>thermal</b>, udara menipis di ketinggian, massa roket berkurang, stabilitas dari ekor & sirip, serta pantulan & gesekan (rumput, pasir, aspal, air).</div></div>
    <div class="noads"><span>✕ Iklan video</span><span>✕ "Tonton iklan x2"</span><span>✕ Timer energi</span><span>✕ Pay-to-win</span></div>
    <div class="noads" style="margin-top:8px"><span style="border-color:var(--line);color:var(--muted)">Map selesai: ${fmt(save.cleared)}</span><span style="border-color:var(--line);color:var(--muted)">Penerbangan: ${fmt(save.flights)}</span><span style="border-color:var(--line);color:var(--muted)">Total: ${fmt(save.total)} m</span></div>
    <button class="reset" id="gReset">Reset semua progress</button>`;
}
$('garage').addEventListener('click',e=>{
  if(e.target.id==='gReset'){ if(confirm('Hapus semua progress (koin, level, upgrade)?')){ save={...DEF,best:[...DEF.best],mute:save.mute}; persist(); rebuildModels(); resetWorld(); renderGarage(); } return; }
  const b=e.target.closest('[data-k]'); if(!b||b.disabled) return;
  const k=b.dataset.k, p=PRICE[k](save[k]), cap={wing:10,sling:10,prop:10,rocket:10,bonus:Infinity}[k];
  if(save.coins>=p && save[k]<cap){ save.coins-=p; save[k]++; tone(500,1000,0.2,'square',0.12); }
  persist(); rebuildModels(); renderGarage();
});
$('btnGo').onclick=()=>{ audio(); enterAim(); };
$('btnGarage').onclick=()=>{ if(state==='aim'||state==='result') openGarage(); };
$('btnMute').onclick=()=>{ save.mute=!save.mute; persist(); $('btnMute').textContent=save.mute?'🔇':'🔊'; if(master) master.gain.value=save.mute?0:0.55; };
$('btnMute').textContent=save.mute?'🔇':'🔊';
$('bSkip').onclick=()=>endFlight();
$('bFast').onclick=()=>{ timeScale=timeScale===1?2:timeScale===2?4:1; $('bFast').textContent='⏩ '+timeScale+'×'; };

/* ================= INPUT ================= */
canvas.addEventListener('pointerdown',e=>{
  const a=audio(); if(a&&a.state==='suspended') a.resume();
  if(state!=='aim') return;
  aim.active=true; aim.sx=e.clientX; aim.sy=e.clientY; try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
});
canvas.addEventListener('pointermove',e=>{
  if(state!=='aim'||!aim.active) return;
  const dx=e.clientX-aim.sx, dy=e.clientY-aim.sy, len=Math.hypot(dx,dy);
  aim.frac=clamp(len/(0.32*Math.min(innerWidth,innerHeight)),0,1);
  if(len>6){ let ang=Math.atan2(dy,-dx); if(-dx<0) ang = dy>0?1.3:-0.1; setAng(clamp(ang,-0.1,1.3)); }
  restPose(); updateAimInfo(); updatePreview();
});
const pointerEnd=()=>{
  if(state!=='aim'||!aim.active) return; aim.active=false;
  if(aim.frac>0.08) launch(); else { aim.frac=0; restPose(); preview.visible=false; updateAimInfo(); }
};
canvas.addEventListener('pointerup',pointerEnd); canvas.addEventListener('pointercancel',pointerEnd);

const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'rocket'};
let kbuf='';
const kh=s=>[...s].reduce((a,c)=>(Math.imul(a,131)+c.charCodeAt(0)+7)>>>0,2166136261);
addEventListener('keydown',e=>{
  const k=KEYMAP[e.code]; if(k){ keys[k]=true; if(state==='flight'||k==='rocket') e.preventDefault(); }
  if(e.code==='Enter' && state==='result' && $('rAgain')) enterAim();
  if(state==='garage' && e.key && e.key.length===1){
    kbuf=(kbuf+e.key.toLowerCase()).slice(-7);
    if(kh(kbuf)===1058875322){ kbuf=''; save.coins+=1e6; persist(); renderGarage(); }
  }
});
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k) keys[k]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
for(const [id,k] of [['bUp','up'],['bDown','down'],['bLeft','left'],['bRight','right'],['bRocket','rocket']]){
  const el=$(id);
  el.addEventListener('pointerdown',e=>{ btn[k]=true; el.classList.add('on'); try{ el.setPointerCapture(e.pointerId); }catch(_){} e.preventDefault(); });
  const off=()=>{ btn[k]=false; el.classList.remove('on'); };
  el.addEventListener('pointerup',off); el.addEventListener('pointercancel',off); el.addEventListener('lostpointercapture',off);
}

/* ================= HUD ================= */
function updateAimInfo(){
  $('aPow').textContent=Math.round(aim.frac*100)+'%';
  $('aAng').textContent=Math.round(aim.ang*180/Math.PI)+'°';
  $('aSpd').textContent=fmt(launchSpeed(st,aim.frac)*3.6)+' km/j';
}
function updatePreview(){
  if(aim.frac<0.05){ preview.visible=false; return; }
  const v=launchSpeed(st,aim.frac);
  const s={x:plane.group.position.x,y:plane.group.position.y,z:0,vx:v*aim.dx,vy:v*aim.dy,vz:0,theta:aim.ang,phi:0,alpha:0,m:st.mass,fuel:st.fuel,rfuel:0,onGround:false,burning:false,impact:0,crashed:false};
  for(let i=0;i<PRE;i++){ for(let k=0;k<4;k++) stepPhys(s,st,1/60,0,0,false,0); prePos[i*3]=s.x; prePos[i*3+1]=s.y; prePos[i*3+2]=s.z; }
  preGeo.attributes.position.needsUpdate=true; preview.visible=true;
}
function updateHud(){
  const V=Math.hypot(P.vx,P.vy,P.vz), fl=state!=='aim';
  const L = (last&&(state==='landed'||state==='result'))?last.L:curLevel();
  const d=fl?Math.max(0,P.x):0;
  $('hDist').textContent=fmt(d)+' m';
  $('hAlt').textContent=fmt(fl?Math.max(0,P.y-st.hb):0)+' m';
  $('hSpd').textContent=fmt(fl?V*3.6:0)+' km/j';
  $('hCoins').textContent=fmt(fl?Math.floor(d*st.mult)+flight.ringCoins:0);
  $('hLevel').textContent=`LEVEL ${LEVELS.indexOf(L)+1} • ${fmt(d)} / ${fmt(L.target)} m`;
  $('uProg').style.width=clamp(d/L.target,0,1)*100+'%';
  const w=wind.base, c=wind.cross;
  $('hWind').textContent=(Math.abs(w)<0.3?'🍃 Tenang':(w>0?'🍃 Dorong → ':'🍃 Depan ← ')+Math.abs(w).toFixed(1))+(Math.abs(c)>=0.3?` • samping ${c>0?'▶':'◀'} ${Math.abs(c).toFixed(1)}`:'')+' m/s';
  $('hBiome').textContent=BIOMES[state==='flight'||state==='aim'?biomeAt(d):0].name;
  $('barEng').style.display=st.fuel>0?'block':'none';
  $('barRkt').style.display=st.rBurn>0?'block':'none';
  $('uEng').style.width=(st.fuel>0?clamp((state==='flight'?P.fuel:st.fuel)/st.fuel,0,1)*100:0)+'%';
  $('uRkt').style.width=(st.rBurn>0?clamp((state==='flight'?P.rfuel:st.rBurn)/st.rBurn,0,1)*100:0)+'%';
  $('hStall').style.display = state==='flight' && !P.onGround && !P.crashed && Math.abs(P.alpha)>st.aStall ? 'inline-block':'none';
}

/* ================= LOOP ================= */
const clock=new THREE.Clock();
function checkHits(){
  const sz=st.size;
  for(const r of rings){ if(r.taken||Math.abs(r.x-P.x)>3) continue;
    if(Math.hypot(r.x-P.x,r.y-P.y,r.z-P.z)<1.5+0.35*sz){ r.taken=true; r.m.visible=false; flight.rings++; const val=Math.round(10*curLevel().plane*st.mult); flight.ringCoins+=val;
      tone(1200,1900,0.14,'sine',0.2); emit(r.x,r.y,r.z,0,1,0,0xfacc15,0.8,24,4); } }
  if(P.crashed) return;
  for(const o of obstacles){
    if(o.hit) continue;
    if(o.type==='col'){ if(Math.abs(o.x-P.x)>o.r+st.pr+1) continue;
      if(P.y<o.h+st.pr*0.5 && Math.hypot(o.x-P.x,o.z-P.z)<o.r+st.pr){ crashInto(o); return; } }
    else if(o.type==='box'){ if(Math.abs(o.x-P.x)>o.hx+st.pr+1) continue;
      if(P.y<o.h+st.pr*0.5 && Math.abs(o.z-P.z)<o.hz+st.pr && Math.abs(o.x-P.x)<o.hx+st.pr){ crashInto(o); return; } }
    else { if(Math.abs(o.x-P.x)>o.r+st.pr+1) continue;
      if(Math.hypot(o.x-P.x,o.y-P.y,o.z-P.z)<o.r+st.pr){ o.hit=true; flight.hits++;
        const big=!o.bird; P.vx*=big?0.55:0.8; P.vy=P.vy*0.4+(big?2:0.5); P.vz+=(P.z-o.z)*0.5;
        o.m.visible=false; if(o.m2) o.m2.visible=false;
        burst(big?0.2:0.1,big?2500:3200,0.4); emit(o.x,o.y,o.z,0,0,0,big?0xf87171:0x9ca3af,0.7,big?40:12,big?6:3);
        if(big) shake=0.25; } }
  }
}
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05), sz=st.size, now=performance.now()/1000;

  for(const o of obstacles){ if(o.bird && !o.hit){ o.z=o.z0+o.amp*Math.sin(now*0.8+o.ph); o.m.position.set(o.x,o.y+Math.sin(now*3+o.ph)*0.4,o.z); o.m.rotation.y=Math.cos(now*0.8+o.ph)>0?-Math.PI/2:Math.PI/2; o.wg.scale.z=0.6+0.4*Math.abs(Math.sin(now*12+o.ph)); } }

  if(state==='flight'){
    const tu=((keys.up||btn.up)?1:0)-((keys.down||btn.down)?1:0);
    const tl=((keys.right||btn.right)?1:0)-((keys.left||btn.left)?1:0);
    inputU+=(tu-inputU)*Math.min(1,dt*6); inputLR+=(tl-inputLR)*Math.min(1,dt*6);
    const rocketOn=keys.rocket||btn.rocket;
    acc+=dt*timeScale; let impact=0;
    while(acc>=H){
      stepPhys(P,st,H,inputU,inputLR,rocketOn,flight.t); flight.t+=H; acc-=H;
      impact=Math.max(impact,P.impact); checkHits();
      if(!flight.won && P.x>=curLevel().target){ flight.won=true; tone(784,1568,0.4,'square',0.15); emit(P.x,P.y,P.z,0,3,0,0x4ade80,1.2,60,8); hint('🏁 FINISH! Level selesai — terus terbang buat koin tambahan!',3500); }
    }
    if(impact>2.5){ burst(0.25,impact>8?300:600,Math.min(0.5,impact*0.04));
      const water=biomeAt(P.x)===3; emit(P.x,0.2,P.z,P.vx*0.2,2,P.vz*0.2,water?0x93c5fd:0xb8a27a,water?1.2:0.8,Math.min(40,Math.floor(impact*3)),water?3:1.6); }
    const V=Math.hypot(P.vx,P.vy,P.vz);
    flight.maxAlt=Math.max(flight.maxAlt,P.y-st.hb); flight.maxSpd=Math.max(flight.maxSpd,V);
    if(P.onGround && V<0.4) flight.rest+=dt; else flight.rest=0;
    if(P.onGround && flight.t>3) $('bSkip').style.display='inline-block';
    if(flight.rest>0.6 || flight.t>360) endFlight();
    ensureChunks(P.x);
    if(P.burning) for(const f of plane.flames){ _v.copy(f.position); plane.group.localToWorld(_v); emit(_v.x,_v.y,_v.z,P.vx*0.5-camDir.x*8,P.vy*0.5,P.vz*0.5-camDir.z*8,0xff8a2a,0.35,2,1); }
    if(st.L.plane===7 && P.fuel>0 && Math.random()<0.5){ _v.set(-0.2*sz,-0.12*sz,0.4*sz*(Math.random()<0.5?1:-1)); plane.group.localToWorld(_v); emit(_v.x,_v.y,_v.z,P.vx*0.6,P.vy*0.6,P.vz*0.6,save.prop>=7?0x3b82f6:0x334155,1.2,1,0.4); }
    if(P.crashed && !P.onGround && Math.random()<0.6) emit(P.x,P.y,P.z,0,1,0,0x555555,1.2,1,0.5);
    tTimer+=dt; if(tTimer>0.03){ tTimer=0; trailPush(P.x,P.y,P.z); }
    if(AC){ rocketGain.gain.value=P.burning?0.35:0; windGain.gain.value=Math.min(0.25,V*V*0.00012); }
  } else if(AC && windGain){ windGain.gain.value*=0.9; rocketGain.gain.value=0; }

  if(state==='landed'){ resultTimer-=dt; if(resultTimer<=0) showResult(); }

  if(state==='flight'||state==='landed'||state==='result'){
    plane.group.position.set(P.x,P.y,P.z);
    const hv=Math.hypot(P.vx,P.vz), yaw=hv>0.3?Math.atan2(-P.vz,P.vx):plane.group.rotation.y;
    const wob = !P.onGround ? (st.L.plane<=2?0.1*wind.gust:0)*Math.sin(flight.t*3.1)+(1-st.yawStab)*0.15*Math.sin(flight.t*2.2) : 0;
    plane.group.rotation.set(P.phi+wob+(P.crashed?flight.t*4:0), yaw, P.theta);
    plane.flames.forEach(f=>{ f.visible=P.burning; const k=rand(0.8,1.3); f.scale.set(k,k*rand(0.9,1.5),k); });
    if(plane.prop) plane.prop.rotation.x+=dt*(P.fuel>0?70:Math.hypot(P.vx,P.vy)*1.5);
  } else if(plane.prop) plane.prop.rotation.x+=dt*3;
  if(release.t>=0){
    release.t+=dt; const k=Math.exp(-5*release.t)*Math.cos(28*release.t);
    sling.pouch.position.lerpVectors(sling.fork,release.from,k); updBands();
    if(release.t>2) release.t=-1;
  }
  for(const r of rings) if(!r.taken) r.m.rotation.x=now*1.5;
  const cx=camera.position.x;
  for(const t of thermals){ if(Math.abs(t.x-cx)>400) continue; const a=t.pts.geometry.attributes.position;
    for(let k=0;k<t.N;k++){ let y=a.array[k*3+1]+t.w*dt*1.5; if(y>t.top) y=0; a.array[k*3+1]=y; } a.needsUpdate=true; }
  updParticles(dt);

  const pp=plane.group.position;
  if(state==='garage'){
    orbit+=dt*0.3; const R=(st.L.plane===5?2.8:2.3)*sz+1.0;
    camera.position.set(pp.x+Math.cos(orbit)*R, pp.y+0.7*sz+0.4, Math.sin(orbit)*R);
    camLook.set(pp.x,pp.y,0);
  } else if(state==='aim'){
    const want=_v.set(-2.5-1.2*sz-aim.frac*1.5, 2.6+1.0*sz+aim.frac*1.2, 5+3.2*sz+aim.frac*3);
    camera.position.lerp(want,1-Math.exp(-4*dt));
    camLook.lerp(_w.set(3+1.5*sz+aim.frac*5,2.2+sz*0.6+aim.frac*1.5,0),1-Math.exp(-4*dt));
  } else {
    const hv=Math.hypot(P.vx,P.vz);
    if(hv>1) camDir.lerp(_w.set(P.vx/hv,0,P.vz/hv),1-Math.exp(-2.5*dt)).normalize();
    const V=Math.hypot(P.vx,P.vy,P.vz), back=4*sz+4+Math.min(V,80)*0.05;
    const want=_v.set(P.x-camDir.x*back-camDir.z*1.2*sz, Math.max(1.2,P.y+1.3*sz+1.4), P.z-camDir.z*back+camDir.x*1.2*sz);
    camera.position.lerp(want,1-Math.exp(-(state==='flight'?3.5:2)*dt));
    camLook.lerp(_w.set(P.x+camDir.x*(6+V*0.12),P.y+0.4*sz,P.z+camDir.z*(6+V*0.12)),1-Math.exp(-5*dt));
  }
  if(shake>0){ shake=Math.max(0,shake-dt); camera.position.x+=rand(-1,1)*shake; camera.position.y+=rand(-1,1)*shake; }
  camera.lookAt(camLook);
  sky.position.copy(camera.position);
  placeSun(pp.x,Math.min(pp.y,60),pp.z);
  if(state!=='garage') updateHud();
  renderer.render(scene,camera);
}

/* ================= START ================= */
rebuildModels(); resetWorld(); openGarage();
$('loading').style.display='none';
frame();
</script>
